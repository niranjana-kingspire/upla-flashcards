<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wedding - Anton Chekhov | Flashcards - L3</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Wedding - Anton Chekhov | Flashcards - L3</h1>
    <p class="subtitle">Anton Chekhov · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"How did Anton Chekhov's background as a doctor influence his portrayal of characters in drama?",
"It instilled a habit of precise, clinical observation without passing direct moral judgement on character flaws."
],
[
"In Chekhov's satirical approach, what role is left to the audience regarding social flaws?",
"The audience is trusted to diagnose the social illness presented on stage without explicit authorial guidance."
],
[
"What character type does Nunin embody in Anton Chekhov's play *The Wedding*?",
"Nunin embodies the classic comic enabler whose attempt to please everyone generates social chaos."
],
[
"What situational irony defines Nunin's professional background relative to his actions at the wedding?",
"As an insurance agent whose job is managing risk, he actively creates risk at the wedding party."
],
[
"What lie does Nunin present upon introducing Revunov to the Zhigalov family?",
"He presents Revunov as an active military general rather than a hired naval retiree."
],
[
"What exact words does Nunin whisper to Revunov to preserve his scheme before the introductions?",
"Nunin whispers, 'Be a good man and let us call you your excellency â€” the family respects rank.'"
],
[
"How does Nunin react when his deception regarding Revunov collapses?",
"He attempts to deflect from the collapse by calling for a toast and shouting, 'A march! A march!'"
],
[
"What is the first step in the four-step analytical method for identifying comic devices in drama?",
"The first step is explicitly naming the comic device being used."
],
[
"In the four-step analytical method for comic devices, what action follows describing the specific textual moment?",
"The third step requires explaining the comic effect the moment creates for the audience."
],
[
"What is the final step of the four-step analytical method for dramatic comic devices?",
"The final step is connecting the device's effect to a broader character trait or theme."
],
[
"How is the comic device of incongruity demonstrated during the dinner scene in *The Wedding*?",
"It is demonstrated when Revunov shouts nautical commands like 'Furl the fore-topsail!' at a formal dinner table."
],
[
"What thematic point does Chekhov highlight through Revunov's inappropriate nautical outbursts?",
"He highlights that genuine professional expertise and artificial social performance are completely incompatible."
],
[
"How does dramatic irony function when Nastasya Timofeyevna bows to Revunov as 'your excellency'?",
"The audience knows Revunov is a hired retiree, rendering her earnest social deference funny and hollow."
],
[
"What theatrical experience does dramatic irony create when the audience hears Nunin's whisper to Revunov?",
"It creates a double theatrical experience where actions appear earnest to characters but absurd to the audience."
],
[
"What catchphrase does the character Dimba repeatedly state in *The Wedding*?",
"Dimba repeatedly states, 'Yes, everysing is zere.'"
],
[
"What is the first step when structuring a thematic paragraph on Chekhovian drama?",
"The first step is stating the central theme and identifying the play."
],
[
"In a four-step thematic analysis paragraph, what follows providing specific textual evidence?",
"The third step is explaining what the textual moment reveals about the specific theme."
],
[
"What final connection should be made at the conclusion of a structured thematic paragraph?",
"The conclusion should connect the textual evidence to a broader social truth."
],
[
"How does Anton Chekhov conceptualise social climbing throughout *The Wedding*?",
"He conceptualises social climbing as a collectively maintained fiction requiring continuous financial investment."
],
[
"What financial transaction represents the thematic core of social climbing in *The Wedding*?",
"The 25-rouble payment made to hire a military general for the reception."
],
[
"What does Nastasya Timofeyevna's demand for the return of the 25 roubles reveal about social prestige?",
"It reveals that social prestige has been reduced to a commercial transaction that is bought rather than earned."
],
[
"According to Chekhov's satire in *The Wedding*, what two roles are required for social deception to succeed?",
"It requires one party to sell a performance and another party to accept it without investigation."
],
[
"How does Nastasya Timofeyevna demonstrate her complicity in Nunin's deception?",
"She asks for reassurance rather than investigating Revunov's credentials when inquiring if she is being deceived."
],
[
"What modern parallel mirrors the mechanism of Nunin's 25-rouble scheme to purchase rank?",
"Purchasing social media followers or unearned credentials to project fake status."
],
[
"Term: Indirection (Chekhovian Drama)",
"Definition: Delivering a satirical point through neutral dramatic observation without explicit authorial comment."
],
[
"How does Chekhov employ indirection when Nastasya demands, 'Andrey, where are those 25 roubles?'",
"He records her response without commentary, letting her focus on money expose her moral emptiness."
],
[
"What satirical purpose is served by deriving the character name Aplombov from the word 'aplomb'?",
"It primes the audience to view the character's every pompous action as confirmation of self-important pretension."
],
[
"What visual and spoken chaos marks the final moments before the curtain falls in *The Wedding*?",
"Zmeyukina cries that she is suffocating while Yats reacts theatrically and a groomsman attempts a speech."
],
[
"What is the satirical significance of Chekhov's abrupt curtain ending in *The Wedding*?",
"It demonstrates that social chaos and pretension do not resolve into moral growth or self-correction."
],
[
"Chekhov's background as a _____ gave him the habit of clinical, dispassionate observation.",
"doctor"
],
[
"Nunin's character type in *The Wedding* is best described as a comic _____.",
"enabler"
],
[
"When caught in his deception, Nunin attempts to change the subject using _____ rather than an apology.",
"deflection"
],
[
"In dramatic irony, comic laughter is generated by the gap in knowledge between the audience and the _____.",
"characters"
],
[
"Nastasya Timofeyevna's outrage upon discovering Revunov's identity is financial rather than _____.",
"moral"
],
[
"Chekhov's technique of pre-emptive commentary through character names is exemplified by the name _____.",
"Aplombov"
],
[
"The abrupt ending of *The Wedding* shows that social pretension is self-perpetuating rather than self-_____.",
"correcting"
],
[
"How does Chekhov handle Revunov's lengthy nautical monologues without using direct narrative commentary?",
"He allows the mounting discomfort of the guests in the room to speak for itself."
],
[
"What specific job does Nunin hold that contrasts comically with his actions in the play?",
"He works as an insurance agent."
],
[
"Why is the Zhigalov family unable to expose Revunov's true rank upon his arrival?",
"They have never met a general and defer blindly to rank without checking credentials."
],
[
"What core takeaway defines the application of comic device analysis in literature?",
"Precise identification of the device, textual moment, and specific comic effect is required."
],
[
"How does Revunov's shout, 'Hoist her top-sheets and mainsail!', function as a comic device?",
"It functions as incongruity by introducing inappropriate naval terminology into a formal wedding dinner."
],
[
"Why does Nunin ask Revunov to allow the family to address him as 'your excellency'?",
"Nunin is situationally desperate because he promised a general he could not provide."
],
[
"What thematic lesson does Chekhov convey about purchased social prestige?",
"Social prestige can be purchased temporarily but cannot be genuinely owned."
],
[
"How does the Zhigalov family view the presence of a military general at their wedding reception?",
"They view it as a necessary commercial transaction to secure social standing."
],
[
"What does the refusal to provide a moral resolution at the end of *The Wedding* suggest about society?",
"It suggests that societal pretension is an unceasing cycle that does not reform itself."
],
[
"What structural element immediately follows the content chunks in each subtopic of the course text?",
"Five practice questions accompanied by full explanations."
],
[
"Which level of Bloom's Taxonomy emphasizes demonstrating skill by applying analytical methods to scenes?",
"Level 3 (Apply)."
],
[
"What does Chekhov achieve by having Nunin whisper his request to Revunov in full view of the audience?",
"He establishes dramatic irony by letting the audience share a secret hidden from the host family."
],
[
"Why is social respect based on false information considered hollow in *The Wedding*?",
"It is based entirely on an agreed performance rather than authentic merit or rank."
],
[
"In Chekhov's satirical style, what is the main function of dramatic indirection?",
"To allow the audience to draw moral conclusions directly from observed actions without explicit guidance."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
