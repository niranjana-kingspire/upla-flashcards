<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chimney Sweeper - William Blake | Flashcards - L5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Chimney Sweeper - William Blake | Flashcards - L5</h1>
    <p class="subtitle">William Blake · 85 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"How does Blake dramatise child labour in 'The Chimney Sweeper'?",
"Through the boy's own broken speech and cry of ''weep!' instead of 'sweep!'."
],
[
"What phonetic detail in the boy's cry registers his extreme youth?",
"The cry of ''weep!' instead of 'sweep!' due to a lisp."
],
[
"Why is Blake's technique of using the child's speech more effective than moral commentary?",
"It forces the reader, rather than the child, to recognise the injustice."
],
[
"What economic reality of eighteenth-century England is reflected in the poem's opening?",
"Impoverished families selling their young children into the chimney sweeping trade."
],
[
"Why were small children specifically chosen to be apprenticed to master sweeps?",
"Their small bodies could fit inside the narrow flues of chimneys."
],
[
"What are the two levels of exploitation operating in the poem?",
"Economic exploitation and psychological exploitation."
],
[
"How is economic exploitation explicitly represented in 'The Chimney Sweeper'?",
"Through the sale of child labour for profit."
],
[
"According to a critical reading, what is the subtle function of the angel's promise?",
"It acts as a mechanism that keeps the children compliant with their condition."
],
[
"Why is psychological exploitation considered more damning than economic exploitation?",
"It recruits religion to maintain an unjust social system."
],
[
"How does the poem evaluate the concept of 'comfort' for the children?",
"As something manufactured for those who have no other recourse."
],
[
"What is the single most contested evaluative question regarding the theme of hope?",
"Whether it represents genuine consolation or an ironic trap."
],
[
"What evidence supports the view that hope has psychological survival value for Tom?",
"He wakes up 'happy and warm' despite his objectively unchanged conditions."
],
[
"Why might the closing couplet be considered 'dangerous' by some critics?",
"It teaches endurance of suffering rather than resistance against it."
],
[
"What stylistic feature of the closing couplet makes its message particularly potent?",
"It is delivered without any adult irony to mark it as false."
],
[
"How does 'The Chimney Sweeper' from Songs of Experience differ from the Innocence version?",
"It openly blames institutional authority for the children's suffering."
],
[
"Why is a literal reading of the poem's final line difficult to sustain?",
"It contradicts Blake's consistent suspicion of institutional religion."
],
[
"The Innocence version of the poem is described as an _____ perspective, awaiting the reader's judgement.",
"incomplete"
],
[
"In what year was 'The Chimney Sweeper' first published in Songs of Innocence?",
"1789"
],
[
"What did Blake state was the purpose of pairing Songs of Innocence and Songs of Experience?",
"To show 'the two contrary states of the human soul'."
],
[
"When read as a diptych, what does the poem argue society does with suffering?",
"It disguises suffering as acceptable through a child's untroubled voice."
],
[
"What was the legislative context regarding child labour in Britain in 1789?",
"Parliament had not yet passed meaningful restrictions on the practice."
],
[
"What later 19th-century legislation eventually restricted the trade of sweeping?",
"The Chimney Sweepers Acts."
],
[
"What is the central literary technique employed in the poem?",
"Dramatic irony."
],
[
"How is dramatic irony generated between the narrator and the reader?",
"The child reports his exploitation without recognising it as such."
],
[
"What does the reader perceive about the angel's promise that the child does not?",
"The child's harm is ongoing and structural, despite the promise of safety."
],
[
"What is the principal strength of using dramatic irony in this poem?",
"It avoids didacticism, letting the injustice indict itself."
],
[
"What is the 'principal risk' of Blake's ironic technique in 'The Chimney Sweeper'?",
"A careless reading may mistake the child's consolation for the poem's actual conclusion."
],
[
"Why does critical consensus favour an ironic reading of the innocent voice?",
"Blake consistently used innocent voices to indict adult institutions."
],
[
"Surface Reading vs Evaluative: What is the evaluative reading of the child's sale?",
"Evidence of a society that commodifies its own children."
],
[
"Surface Reading vs Evaluative: What is the implied critique of the angel's promise?",
"A theological narrative that defers justice instead of delivering it."
],
[
"Surface Reading vs Evaluative: What is the implied critique of the closing couplet?",
"Conditioning that normalises present suffering."
],
[
"Surface Reading vs Evaluative: What is the evaluative reading of child labour as a theme?",
"Evidence indicting an economy built on cheap, disposable child labour."
],
[
"Surface Reading vs Evaluative: What is the evaluative reading of exploitation as a theme?",
"Psychological conditioning used to secure present compliance."
],
[
"How does the child-narrator's cry of ''weep!' register his youth?",
"It serves as a phonetic indicator of a lisp, showing he is a very small child."
],
[
"What does the text suggest about the role of religion in 'The Chimney Sweeper'?",
"It is recruited into the maintenance of an unjust system."
],
[
"How does Tom Dacre's dream sustain him?",
"It provides a psychological comfort that allows him to wake 'happy and warm'."
],
[
"The gap between what the boy says and what the reader understands generates _____.",
"horror"
],
[
"What term describes the reading of Songs of Innocence and Experience together?",
"Diptych."
],
[
"The boy's cry of ''weep! 'weep!' is an example of _____.",
"broken speech"
],
[
"What historical reality did impoverished families use to justify apprenticing children?",
"Economic necessity due to impoverishment."
],
[
"In the poem's surface reading, why was the child's sale considered explainable?",
"As an unfortunate but necessary act for survival."
],
[
"What is the evaluative reading of hope as a 'structural device'?",
"It may pacify the sufferer rather than liberate them."
],
[
"Critically, what is more 'damning' than physical exploitation in the poem?",
"Quiet, psychological exploitation."
],
[
"Why is the historical specificity of the poem's opening lines significant?",
"It provides an indicting context rather than simple pathos."
],
[
"What does the final couplet suggest if taken at face value?",
"It endorses patient suffering and dutiful work."
],
[
"How long after Songs of Innocence was Songs of Experience published?",
"Five years."
],
[
"Blake uses an innocent voice to indict institutions that the voice cannot _____ through.",
"see"
],
[
"Term: Dramatic Irony",
"Definition: A technique where the reader understands the horror of a situation that the narrator does not recognise."
],
[
"What is the result of 'psychological conditioning' in the context of the poem?",
"It secures compliance from the children by promising future rewards."
],
[
"What does the child lack that prevents him from fearing harm?",
"Knowledge that his exploitation is structural and ongoing."
],
[
"The 1789 publication reflects British _____ about the practice of child labour.",
"anxiety"
],
[
"What is the risk of a 'purely sympathetic reading' of the poem?",
"It tends to flatten the two levels of exploitation into one."
],
[
"What is the evaluative reading of the child's individual 'hardship and neglect'?",
"An indictment of an economy built on disposable child labour."
],
[
"How is the 'theological narrative' of the angel evaluated?",
"As a tool that defers justice rather than delivering it."
],
[
"What does the boy's cry of ''weep!' replace in his speech?",
"The trade cry of 'sweep!'."
],
[
"Why is the boy's lack of protest significant for Blake's social critique?",
"It forces the reader to acknowledge the injustice for themselves."
],
[
"What is the critical interpretation of the manufactured 'comfort' in the poem?",
"It is provided to those who have no other options for relief."
],
[
"According to the text, the closing couplet lacks _____.",
"adult irony"
],
[
"In 'The Chimney Sweeper' (Innocence), who is blamed for the suffering?",
"No one explicitly; the child narrator does not recognise the exploitation."
],
[
"Blake's diptych suggests society uses the child's voice to _____ suffering.",
"disguise"
],
[
"What does the term 'commodify' mean in the context of the child's sale?",
"To treat a human child as a marketable object for profit."
],
[
"How does the angel's promise affect the power dynamic in the poem?",
"It maintains the status quo by promising future joy in exchange for present compliance."
],
[
"What is the 'evaluative' view of Tom waking 'happy and warm'?",
"It illustrates how hope can be used as a tool to ensure endurance of hardship."
],
[
"What does the poem suggest about the relationship between religion and social justice?",
"Religion can be used to defer justice and pacify the oppressed."
],
[
"How is the sale of children by fathers described in the historical context of the poem?",
"As a documented practice of eighteenth-century England."
],
[
"The poem's technique avoids being _____, letting the injustice indict itself.",
"didactic"
],
[
"What is the surface reading of the theme of Hope?",
"Comfort that helps the child endure his situation."
],
[
"What is the evaluative reading of physically dangerous, unpaid work?",
"Economic exploitation for the purpose of profit."
],
[
"In the diptych, which poem represents the more 'complete' or judging perspective?",
"The Songs of Experience version."
],
[
"Why does the reader perceive the boy's lack of fear as a negative sign?",
"It indicates the boy has been successfully conditioned to ignore his own harm."
],
[
"The boy's speech registering his youth is an example of Blake's use of _____.",
"pathos"
],
[
"How does the angel's promise maintain the 'unjust system'?",
"By persuading the victims that their suffering is temporary and rewarded by God."
],
[
"What is the risk of taking the final line of the poem at 'face value'?",
"It would lead the reader to endorse the conditioning of child labourers."
],
[
"The poem's evaluation shifts from simple allegory to _____ social commentary.",
"topical"
],
[
"What is the 'critical consensus' regarding the interpretation of the poem?",
"It favours the ironic interpretation over the literal one."
],
[
"How does the reader's knowledge contrast with the boy's in the dramatic irony?",
"The reader knows the harm is structural while the boy believes the angel's promise."
],
[
"The boy's cry of ''weep!' is delivered before any _____ is stated outright.",
"theme"
],
[
"What is the 'evaluative' significance of Tom Dacre's dream?",
"It serves as a psychological mechanism to endure unchanged conditions."
],
[
"How does the Innocence version of the poem treat institutional authority?",
"It remains silent, leaving the indictment of institutions to the reader."
],
[
"Why were small bodies an economic necessity in the chimney sweeping trade?",
"To navigate the narrow, hazardous interior flues of the time."
],
[
"How does Blake's use of the child's voice function as an 'ironic trap'?",
"It presents suffering in a way that sounds acceptable but is actually horrific."
],
[
"In a critical reading, what replaces the 'future reward' promised by the angel?",
"A theological narrative that defers actual justice."
],
[
"The 1789 publication occurred before Parliament passed restrictions known as the _____.",
"Chimney Sweepers Acts"
],
[
"What is the 'defensible position' regarding the poem's endorsement of comfort?",
"The poem does not endorse the comfort but exposes how it is manufactured."
],
[
"How does the diptych structure influence the reading of 'The Chimney Sweeper'?",
"It forces a comparison between innocent acceptance and experience-based critique."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
