<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still I Rise - Maya Angelou | Flashcards - L3</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Still I Rise - Maya Angelou | Flashcards - L3</h1>
    <p class="subtitle">Maya Angelou · 60 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What is the first step in the five-part argument structure used in 'Still I Rise'?",
"Stating the core claim."
],
[
"In Angelou's five-part structure, what follows the stating of the core claim?",
"Adding reasons for confidence."
],
[
"What is the third step in the structural template derived from 'Still I Rise'?",
"Rejection of the imagined stereotype or defeat."
],
[
"In the five-part argument structure, what happens after rejecting the imagined defeat?",
"Escalation of the stakes."
],
[
"What is the final step in the five-part structure applied to Angelou's poem?",
"Connecting the personal experience to a collective meaning."
],
[
"When applying the five-part structure to a student mocked for an accent, what serves as the 'core claim'?",
"No matter how you laugh, I will keep speaking."
],
[
"In the hypothetical scenario of a mocked accent, what provides the 'reasons for confidence'?",
"Pride in a language that carries family history."
],
[
"What does 'rejecting the imagined defeat' involve in the context of a student with a mocked accent?",
"Refusing to imagine going silent."
],
[
"How are the 'stakes escalated' when applying Angelou's structure to social mockery?",
"Moving from simple laughter to deeper social exclusion."
],
[
"In the accent mockery scenario, who represents the 'collective meaning'?",
"Other students who share the same accent."
],
[
"What image does Angelou use in 'Still I Rise' to represent 'inner wealth' as a reason for confidence?",
"Oil wells pumping."
],
[
"What physical posture does the speaker refuse when 'rejecting the imagined defeat' in 'Still I Rise'?",
"A bowed head and lowered eyes."
],
[
"How does Angelou escalate the stakes in the fourth part of her poem's structure?",
"Moving from words to physical actions like 'shoot', 'cut', and 'kill'."
],
[
"What is the specific 'collective meaning' identified at the end of 'Still I Rise'?",
"The dream and the hope of the slave."
],
[
"The five-part structure turns a personal grievance into what type of organised writing?",
"Persuasive writing."
],
[
"Define the poetic device 'Metaphor' as applied in the resilience framework.",
"Comparing a person's situation to a symbolic image, such as a seed surviving winter."
],
[
"What is 'Anaphora' in the context of Angelou's poetic style?",
"Repeating a sequence of words at the beginning of neighbouring lines, such as 'You may...'."
],
[
"How is 'Repetition' used at the conclusion of 'Still I Rise'?",
"The exact phrase 'I rise' is repeated three times for emphasis."
],
[
"In a poem about recovering from illness, what does the 'seed underground' metaphor represent?",
"Something that is unseen but not destroyed."
],
[
"The lines 'They said I wouldn't walk... They said I wouldn't work...' demonstrate which poetic device?",
"Anaphora."
],
[
"Ending a poem with the line 'I heal, I heal, I heal' is a direct application of which device?",
"Repetition."
],
[
"What does the successful application of Angelou's poetic devices to new subjects demonstrate?",
"That the techniques are transferable to any declaration of resilience."
],
[
"In the five-part structure, Step 2 involves adding _____ for confidence.",
"reasons."
],
[
"What are the three themes used in the framework to analyse 'Still I Rise'?",
"Oppression, Identity, and Empowerment."
],
[
"Within the three-theme framework, what does 'Oppression' specifically refer to?",
"The mockery, lies, or exclusion faced by the speaker."
],
[
"How is the theme of 'Identity' defined in the context of resilience poetry?",
"A connection to a larger community or historical context."
],
[
"In the thematic framework, what is the focus of 'Empowerment'?",
"Taking pride in specific personal details rather than apologising for them."
],
[
"For a first-generation immigrant, what would constitute the 'Oppression' theme?",
"Mockery of their accent and unfamiliar customs."
],
[
"In the immigrant speaker case study, how is the 'Identity' theme applied?",
"Through a connection to the community's migration and adaptation history."
],
[
"What would be an example of the 'Empowerment' theme for an immigrant speaker?",
"Taking pride in their language, food, and family journey."
],
[
"Angelou's use of 'sassiness' and 'oil wells' belongs to which of the three themes?",
"Empowerment."
],
[
"The speaker's connection to 'enslaved ancestors' belongs to which theme?",
"Identity."
],
[
"What does applying the three-theme framework to different cases confirm about the tool?",
"It can be reused to analyse any declaration of identity and resistance."
],
[
"What is the three-approach framework used to classify poems about hardship?",
"'Pity me', 'accept the trade-off', and 'watch me win'."
],
[
"Which poet is associated with the 'pity me' approach involving an unaware voice?",
"William Blake."
],
[
"Which poet's approach is described as 'accept the trade-off'?",
"Ramanujan."
],
[
"What phrase defines Maya Angelou's stance in the three-approach framework?",
"Watch me win."
],
[
"What characterizes a poem in the 'watch me win' category?",
"It ends on a note of chosen defiance and self-respect."
],
[
"A poem about a factory worker ending with 'I chose to stand' fits which classification?",
"Watch me win."
],
[
"Why does a poem ending in 'I chose to stand' fail the 'pity me' classification test?",
"The speaker is fully aware and controls the narrative."
],
[
"Why is a poem about chosen defiance NOT classified as 'accepting a trade-off'?",
"It moves toward a clear, chosen stance rather than an unresolved conflict."
],
[
"What is the purpose of the classification test for unfamiliar poems?",
"It serves as a reusable tool for sorting poems based on their stance toward hardship."
],
[
"The phrase 'still, each morning, I chose to stand' is an application of which original line's sentiment?",
"Still I rise."
],
[
"A poem that describes an unresolved cost fits the '_____ the trade-off' category.",
"accept."
],
[
"What does the 'pity me' framework specifically require from the speaker's voice?",
"An unawareness of their own situation."
],
[
"How does the line 'No matter how you laugh, I will keep speaking' mirror Angelou's grammatical style?",
"It mirrors the grammatical shape of 'but still, like dust, I'll rise'."
],
[
"In the thematic framework, identity is described as something _____ than the individual.",
"larger."
],
[
"What does the 'rejection of imagined defeat' step prevent a speaker from doing?",
"Accepting the negative image others want for them."
],
[
"Step 4 of the five-part structure focuses on increasing the _____ of the situation.",
"stakes."
],
[
"In 'Still I Rise', the transition from personal pride to ancestors represents which structural step?",
"Connecting to collective meaning."
],
[
"What does the metaphor of 'dust' in 'Still I Rise' convey about the speaker's resilience?",
"That she will rise despite being trodden down."
],
[
"In the illness scenario, what device is used to sequence multiple 'They said...' lines?",
"Anaphora."
],
[
"The 'pride-in-specific-detail' approach is a hallmark of which theme?",
"Empowerment."
],
[
"In the factory worker example, what is the 'clear, chosen stance' being declared?",
"The choice to stand despite exhausting labour."
],
[
"In the five-part structure, what is the relationship between the speaker and the 'mockers'?",
"The speaker rejects the image of defeat the mockers desire."
],
[
"How does 'Still I Rise' move beyond a personal grievance?",
"By connecting the speaker's experience to a wider historical community."
],
[
"Applying 'Metaphor' to a new scenario involves finding a _____ image for the subject.",
"comparable."
],
[
"What is the function of 'repetition' in a declaration of resilience?",
"To reinforce a confident stance at the end of the piece."
],
[
"In the immigrant example, what replaces Angelou's 'sassiness' as a detail of pride?",
"Language, food, or the family's journey."
],
[
"What is the primary difference between a 'trade-off' poem and a 'watch me win' poem?",
"The 'watch me win' poem reaches a definitive, resistant conclusion."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
