<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheelchair of Change - Deepa Malik | Flashcards - L1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Wheelchair of Change - Deepa Malik | Flashcards - L1</h1>
    <p class="subtitle">Deepa Malik · 55 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"Who is Deepa Malik?",
"An Indian para-athlete, sports activist, and Paralympic medallist."
],
[
"In which sports publication was the interview \"Welcome to the Wheelchair of Change\" published?",
"Sportstar magazine."
],
[
"On what exact date was Deepa Malik's interview published in Sportstar magazine?",
"23 February 2017."
],
[
"What is the literary format of the text \"Welcome to the Wheelchair of Change\"?",
"A written question-and-answer (Q&A) interview."
],
[
"From where did Deepa Malik speak during her Sportstar interview?",
"Her home in India."
],
[
"What landmark achievement did Deepa Malik accomplish at the Rio 2016 Paralympic Games?",
"She became the first Indian woman to win a Paralympic medal."
],
[
"Which medal and sporting event did Deepa Malik win at the Rio 2016 Paralympics?",
"A silver medal in the shot put event."
],
[
"What medical diagnosis led to Deepa Malik's lower-body paralysis?",
"A spinal tumour that required major surgery."
],
[
"How did spinal tumour surgery physically impact Deepa Malik's mobility?",
"It left her paralysed from the waist down and permanently using a wheelchair."
],
[
"How old was Deepa Malik when she won her first Paralympic medal at Rio 2016?",
"42 years old."
],
[
"Deepa Malik stated, \"I would probably call myself more of a sports _____, than a sportsperson.\"",
"activist"
],
[
"What does the title \"Wheelchair of Change\" signify regarding Deepa Malik's wheelchair?",
"It symbolises transformation and social change rather than physical limitation."
],
[
"Name two diverse non-athletic roles Deepa Malik held outside of track and field sports.",
"Rally driver and member of the Army Wives Welfare Association."
],
[
"How did Deepa Malik adapt her participation in stage events after becoming paralysed?",
"She served as a Master of Ceremonies on stage instead of dancing."
],
[
"What was Deepa Malik's primary motivation for entering sports like biking, swimming, and athletics?",
"To rebuild her identity and publicly prove her happiness."
],
[
"What global ranking did Deepa Malik achieve in the F53 javelin category?",
"World No. 2."
],
[
"At which multi-sport event did Deepa Malik achieve an Asian record in javelin?",
"The Incheon Asian Games."
],
[
"Why was Deepa Malik forced to switch her primary sport from javelin to shot put before Rio 2016?",
"Javelin was excluded from the Rio 2016 Paralympics for her disability category."
],
[
"What distance did Deepa Malik throw in shot put during her qualification at Doha in 2015?",
"3.67 metres."
],
[
"What distance did Deepa Malik achieve in the shot put event at the Rio 2016 Paralympics?",
"4.61 metres."
],
[
"How long did it take Deepa Malik to increase her shot put throw from 3.67 metres to 4.61 metres?",
"11 months."
],
[
"How many total questions are contained in the Sportstar interview with Deepa Malik?",
"Nine questions."
],
[
"How is the overall tone of Deepa Malik's responses in the interview described?",
"Conversational yet purposeful."
],
[
"What is the primary purpose of the interview \"Welcome to the Wheelchair of Change\"?",
"To inform readers about Deepa Malik's life, achievements, and views on Indian para-sports."
],
[
"What style of language is used throughout the Sportstar interview?",
"Plain, accessible language free of sports jargon."
],
[
"Why does Deepa Malik provide detailed, extended answers in her interview?",
"She uses each question as an opportunity to educate the readership on disability and sports."
],
[
"What phrase did Deepa Malik coin as her personal central philosophy?",
"'Ability beyond Disability'."
],
[
"At what age did Deepa Malik first coin the term 'Ability beyond Disability'?",
"36 years old."
],
[
"What event prompted Deepa Malik to coin the phrase 'Ability beyond Disability'?",
"An interview at a National Championship when asked why she was starting at age 36."
],
[
"What is the core meaning of the phrase 'Ability beyond Disability'?",
"A person's individual abilities outweigh the physical limitations imposed by a disability."
],
[
"Whom does Deepa Malik represent when using the term 'we' in her advocacy work?",
"The specially-abled community."
],
[
"What is the ultimate societal goal of Deepa Malik's mission?",
"To make India completely accessible and inclusive across all public sectors."
],
[
"How does Deepa Malik define a truly 'barrier-free' society?",
"Free in mind, psyche, sensitisation, and infrastructure."
],
[
"What structural problem existed regarding sports governing bodies when Deepa Malik began competing?",
"There were no proper para-sports federations in India."
],
[
"How did early Indian para-athletes finance their competition expenses?",
"They had to raise their own personal funds."
],
[
"What paperwork administrative barrier did young Indian para-athletes face for international events?",
"Navigating visa and event entry applications without administrative support."
],
[
"What crucial technical knowledge do most sports coaches in India lack regarding para-sports?",
"Understanding disability categories, muscle functionality, and biomechanics."
],
[
"What physical infrastructure deficiency impacts Indian para-athletes?",
"Public buildings, sports stadiums, and transport systems lack disabled-friendly facilities."
],
[
"By what percentage was the government budget for promoting sports for the disabled reduced?",
"0.9975"
],
[
"What was the reduced financial figure for the disabled sports promotion budget after the cut?",
"Rs. 1 lakh (down from Rs. 4 crore)."
],
[
"What travel incident highlighted public insensitivity towards wheelchair users in Deepa Malik's experience?",
"She was mishandled by airline staff."
],
[
"What interaction in 2010 demonstrated a lack of public awareness regarding adaptive sports?",
"A journalist did not know the meaning of the term 'para-sport'."
],
[
"What term describes the ability to adapt to difficult circumstances and recover from setbacks?",
"Resilience."
],
[
"Term: Inclusion",
"Definition: Ensuring that people with disabilities have equal access to spaces, opportunities, and public life."
],
[
"What positive attitude mindset does Deepa Malik express towards facing obstacles?",
"She feeds on challenges and uses negative comments as motivation."
],
[
"What specific assessment did Deepa Malik conduct to promote inclusion at JLN Stadium?",
"A para-athlete physical accessibility assessment."
],
[
"Which two structural installations does Deepa Malik frequently advocate for to make buildings accessible?",
"Ramps and lifts."
],
[
"What assumption about living with a disability did Deepa Malik aim to publicly disprove?",
"That living with a disability implies a life of sadness."
],
[
"What is a 'para-athlete'?",
"An athlete with a physical, sensory, or intellectual disability competing in adapted sports."
],
[
"What is a 'policy issue' in the context of disability advocacy?",
"A gap or problem in official rules, funding, or infrastructure that impacts a specific group."
],
[
"How does Deepa Malik view the impact of her wheelchair on social perceptions?",
"As an instrument for driving social transformation and changing public attitudes."
],
[
"Which throwing event did Deepa Malik take up after javelin was removed from her disability category?",
"Shot put."
],
[
"What background factor does Deepa Malik credit for developing her challenge-oriented mindset?",
"A sound childhood and upbringing."
],
[
"In which sports magazine was Deepa Malik's landmark post-Rio interview published?",
"Sportstar."
],
[
"Besides athletics and driving, in which water sport did Deepa Malik compete?",
"Swimming."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
