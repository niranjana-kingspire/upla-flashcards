<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wedding - Anton Chekhov | Flashcards - L2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Wedding - Anton Chekhov | Flashcards - L2</h1>
    <p class="subtitle">Anton Chekhov · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"How did Chekhov's medical background influence his depiction of characters in The Wedding?",
"It gave him a clinical eye that allowed him to expose human flaws without moralising or judging them."
],
[
"Which Russian ruler was in power when Chekhov wrote The Wedding?",
"Tsar Alexander III was reigning during the play's creation."
],
[
"What social phenomenon in late 19th-century Russia does Chekhov mock in The Wedding?",
"He mocks the rapidly growing middle class's anxious desire to gain status through rank and titles."
],
[
"Why is a wedding considered an ideal setting for satire on social pretension?",
"It is an inherently public performance where status display is exaggerated before an audience of witnesses."
],
[
"Why is the single-act play structure effective for satire?",
"It catches characters in an embarrassing moment without giving them time for redemption or character growth."
],
[
"How does Chekhov convey his satirical message without using an explicit moral voice?",
"He shows the situation, lets it explode, and relies on the audience to draw their own conclusion."
],
[
"What does Nunin's desperate search for a 'real general' reflect about Russian society?",
"It reflects the authentic middle-class obsession with rank and title in late 19th-century Russia."
],
[
"Why is Andronov's Restaurant significant as the setting for the wedding party?",
"As a hired public space, it serves as a stage where the family performs wealth and status they do not possess."
],
[
"What central desire of Zhigalov drives the entire plot of The Wedding?",
"His desire to have an important official present at the wedding drives the narrative forward."
],
[
"What kind of social anxiety is embodied by the character of Aplombov?",
"He embodies a transactional, upwardly mobile attitude that treats marriage as a financial contract."
],
[
"What is the linguistic origin and meaning of the name Aplombov?",
"It derives from 'aplomb', signalling the character's self-assured pompousness."
],
[
"What role does Nunin play in the social deception at the wedding?",
"He acts as the enabler who hires a retired naval officer to pose as a general."
],
[
"How does Revunov's real character contrast with the expectations of the Zhigalov family?",
"He is an authentic retired naval captain whose actual rank is not prestigious enough for their pretensions."
],
[
"What function do Zmeyukina and Yats serve in the play's structure?",
"They provide a flirtatious comic distraction that adds to the general social absurdity of the scene."
],
[
"What opening complaint by Aplombov demonstrates his transactional view of marriage?",
"He demands the two lottery tickets that were promised to him as part of the domestic agreement."
],
[
"How does Aplombov react to the presence of Yats at the wedding?",
"He complains about the invitation because he views Yats, a former suitor, as a threat to his social presentation."
],
[
"What dramatic irony is established when Nunin whispers to Revunov before his introduction?",
"The audience knows Revunov is a retired naval captain, while the Zhigalov family believes he is a general."
],
[
"What does the dramatic irony regarding Revunov's rank reveal about social prestige?",
"It reveals that social prestige is frequently built on misperception rather than factual reality."
],
[
"What creates the comic incongruity in Revunov's extended monologues?",
"The sharp gap between his expert nautical commands and the context of a peaceful wedding dinner."
],
[
"How does Revunov's deafness function structurally within the play?",
"It prevents him from hearing requests to stop speaking, allowing his monologue to escalate into public crisis."
],
[
"Why does Revunov's deafness keep the comedy innocent rather than malicious?",
"It shows he is not deliberately being rude, preserving audience sympathy as the chaos unfolds."
],
[
"Term: Dimba's running gag",
"Definition: The repeated phrase 'Yes, everysing is zere', which highlights the absurdity of the social conversation."
],
[
"What specific form of social pretension is mocked through the character of Zmeyukina?",
"She is used to mock aesthetic posturing through her theatrical demands for poetry and atmosphere."
],
[
"What social failure is specifically targeted by Chekhov's use of comic incongruity?",
"It targets misplaced expertise displayed in inappropriate social contexts."
],
[
"What would happen to the play's climax if Revunov possessed normal hearing?",
"Social pressure would have silenced him early, preventing the breakdown that leads to the public confrontation."
],
[
"How does the Zhigalov family demonstrate social climbing through their event preparations?",
"They hire an orchestra, reserve a restaurant, and save lobsters specifically for an important guest."
],
[
"What does the guests' initial acceptance of the fake general suggest about social climbing?",
"It suggests that social climbing initially succeeds because guests respect titles without verifying them."
],
[
"How do Nunin and Revunov both contribute to the central deception of the play?",
"Nunin initiates the scheme for money, while Revunov gives passive consent to attend without understanding his role."
],
[
"How does class consciousness manifest when Revunov reveals his actual naval rank?",
"The hosts immediately withdraw their deference and angrily demand the return of their payment."
],
[
"What does the payment of 25 roubles reveal about the family's view of social status?",
"It reveals that they view social prestige as a commercial commodity that can be bought and refunded."
],
[
"What moral outcome is highlighted when Revunov calls the family mean and low before leaving?",
"An honourable man is degraded by people who only value him for a false title."
],
[
"According to Chekhov's thematic framework, what currency makes the system of social climbing function?",
"Class consciousness acts as the currency that drives and ultimately collapses the social performance."
],
[
"How does Nastasya Timofeyevna's tone shift immediately after Revunov's true rank is disclosed?",
"She switches from calling him 'your excellency' to publicly scolding him for taking money under false pretences."
],
[
"What does the rapid shift in the guests' attitude towards Revunov demonstrate?",
"It demonstrates that their respect was attached purely to a symbolic title rather than the person."
],
[
"Concept: Indirection in Satire",
"Definition: A technique where the author presents events without explicit commentary, leaving the audience to deduce the moral judgment."
],
[
"Why is indirection more powerful than direct moralising in drama?",
"It engages the audience as active moral agents who reflect on and reach conclusions themselves."
],
[
"What personality trait is foreshadowed by the name Zmeyukina?",
"It carries a serpentine quality, implying theatricality and attention-seeking behaviour."
],
[
"What visual or vocal trait is suggested by the etymology of the name Revunov?",
"It derives from a word meaning one who shouts, foreshadowing his bellowing of naval commands."
],
[
"What does the simultaneous chaos of multiple superficial conversations convey about the social setting?",
"It shows that social pretension is a widespread cultural condition rather than an isolated character flaw."
],
[
"What is the satirical significance of the play's abrupt curtain fall without a moral resolution?",
"It implies that social pretension does not lead to self-awareness, only to noise before repeating itself."
],
[
"How does Chekhov's satire differ from the direct satire of writers like Jonathan Swift?",
"Chekhov avoids explicit critique and exaggeration, relying instead on quiet, realistic observation."
],
[
"The term _____ describes Chekhov's understated, observational dramatic style that relies on silence and implication.",
"Chekhovian"
],
[
"How does the public setting of Andronov's Restaurant affect the family's eventual humiliation?",
"It ensures that their embarrassment is witnessed by guests and waiters, leaving no room for private face-saving."
],
[
"What does Dashenka's former suitor Yats demand during his comic interactions with Zmeyukina?",
"He demands that Zmeyukina sing for the company while she demands poetry from him."
],
[
"What specific failure of social conversation is targeted by Dimba's repeated phrase?",
"It targets the emptiness and lack of substance in superficial social dialogue."
],
[
"Why do both parties in The Wedding bear responsibility for the ongoing social fiction?",
"The host family is desperately willing to believe the lie, while Nunin actively provides the fake official."
],
[
"In what way does Chekhov position the audience through his use of indirect satire?",
"He positions them as moral judges who must evaluate the characters' actions independently."
],
[
"What does Nastasya Timofeyevna prioritising the 25 roubles over Revunov's feelings reveal about her character?",
"It reveals that her mercenary financial concerns completely outweigh any sense of empathy or hospitality."
],
[
"How does Chekhov's background as a working doctor in Moscow inform the setting of The Wedding?",
"His medical career exposed him daily to middle-class anxieties, which he incorporated directly into his drama."
],
[
"Why is the restraint of authorial commentary considered Chekhov's most effective satirical tool?",
"By declining to explain the joke, he forces the audience to participate in judging the social folly."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
