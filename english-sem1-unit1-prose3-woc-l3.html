<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheelchair of Change - Deepa Malik | Flashcards - L3</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Wheelchair of Change - Deepa Malik | Flashcards - L3</h1>
    <p class="subtitle">Deepa Malik · 55 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What is the primary purpose of an open question in an interview format?",
"It invites a detailed, personal response from the interviewee rather than a simple yes or no."
],
[
"Which question type is rarely used in effective interview formats?",
"Closed questions that elicit single-word or yes/no responses."
],
[
"What does a follow-up question reveal about an interviewer's preparation?",
"It demonstrates that the interviewer conducted prior background research on the subject."
],
[
"How does contextual framing assist the reader in an interview format?",
"It provides necessary factual background context before prompting a focused answer."
],
[
"What specific budget change is cited in Chunk DM-03-L3 as an example of contextual framing?",
"A reduction in financial allocation from Rs. 4 crore to Rs. 1 lakh."
],
[
"How does a respectful tone in interview questions affect the interviewee's responses?",
"It draws out honest and detailed answers rather than defensive replies."
],
[
"Which three question types must be created for the writing task in Chunk DM-03-L3?",
"An open question, a follow-up question, and a question with contextual framing."
],
[
"What three elements are required when analysing an interview question in DM-03-L3?",
"Identifying the question type, state its intended objective, and evaluate if the response addressed it."
],
[
"What is the main takeaway regarding the design of a good interview question?",
"It is structured to unlock an open, informed answer guided by the reader's needs."
],
[
"At Bloom's Level L3, what skill is expected regarding Deepa Malik's mission?",
"Applying the concept of the mission to real-world scenarios and writing about it analytically."
],
[
"How does an individual apply the 'Ability beyond Disability' mission personally?",
"By reframing a personal limitation as a manageable challenge rather than a defeat."
],
[
"Give an example of 'Ability beyond Disability' applied in an academic setting.",
"A student with a learning difficulty using assistive technology to succeed academically."
],
[
"How does an educational institution translate 'Ability beyond Disability' into physical reality?",
"By installing accessibility features such as ramps, lifts, and sign-language interpreters."
],
[
"What government action represents the 'Ability beyond Disability' mission at policy scale?",
"Allocating dedicated sports funding, training specialist coaches, and mandating accessible building codes."
],
[
"What opening sentence structure is required for the writing task in Chunk DM-04-L3?",
"'Deepa Malik's mission, Ability beyond Disability, is not confined to athletics...'"
],
[
"Which non-sporting context demonstrates Deepa Malik's mission operating in policy discussions?",
"Her active participation in government panel discussions."
],
[
"Which sporting venue did Deepa Malik assist with an accessibility audit?",
"Jawaharlal Nehru (JLN) Stadium."
],
[
"What key takeaway defines the scope of Deepa Malik's mission?",
"The mission operates beyond winning medals by transforming physical spaces, policies, minds, and systems."
],
[
"What analytical structure is recommended when writing about policy challenges in Chunk DM-05-L3?",
"The paired Challenge-Solution structure."
],
[
"What primary infrastructure challenge do para-athletes encounter in public spaces?",
"Public buildings and environments are generally not designed to be accessible or disabled-friendly."
],
[
"What policy solution does Deepa Malik propose for existing public infrastructure?",
"Retrofitting existing buildings with ramps, lifts, and modified entry and exit points."
],
[
"What solution is proposed for future building construction regarding accessibility?",
"Ensuring all new structures are built strictly according to disability accessibility norms."
],
[
"What is the primary obstacle regarding para-sport coaching?",
"A complete lack of formally trained para-sport coaches."
],
[
"What educational solution is proposed to resolve the shortage of para-sport coaches?",
"Introducing specialised courses that combine biomechanics, disability awareness, and coaching skills."
],
[
"How does visible physical infrastructure contribute to public awareness of disability?",
"It serves as a constant physical reminder that disabled individuals are active members of society."
],
[
"Besides infrastructure, what factors help build public understanding of para-sports over time?",
"Increasing media coverage and hosting regular public sporting events."
],
[
"What financial challenge affects para-athletes according to Chunk DM-05-L3?",
"Unpredictable and severely reduced government budget allocations."
],
[
"What administrative funding solution does Deepa Malik advocate for para-sports?",
"Securing direct funding allocations from the ministry responsible for disability affairs."
],
[
"What common root links both the coaching challenge and the infrastructure challenge?",
"A systemic lack of institutional preparation for social and physical inclusion."
],
[
"What specific practical assessment did Deepa Malik help conduct at JLN Stadium?",
"A para-athlete acceptability assessment."
],
[
"What key takeaway defines effective advocacy in Chunk DM-05-L3?",
"Advocacy is incomplete unless every identified policy challenge is paired with a practical solution."
],
[
"What four elements comprise the analytical paragraph structure for themes in DM-06-L3?",
"A topic sentence, textual evidence, an analytical explanation, and a wider connection."
],
[
"How does Chunk DM-06-L3 define resilience through Deepa Malik's experience?",
"As a deliberate, active, and strategic adaptation to adversity rather than passive endurance."
],
[
"What setback occurred prior to the Rio Paralympic Games regarding Deepa Malik's event?",
"The Rio Paralympic Games excluded the javelin event from her specific disability category."
],
[
"How did Deepa Malik respond when javelin was excluded from her category at Rio?",
"She restarted from scratch in shot put at age 42 and improved her throw by nearly a metre in 11 months."
],
[
"At what age did Deepa Malik restart her training in shot put for the Rio Olympics?",
"At age 42."
],
[
"By how much did Deepa Malik increase her shot put throwing distance in 11 months?",
"By nearly one metre."
],
[
"What textual evidence is used to demonstrate the theme of inclusion in Chunk DM-06-L3?",
"Deepa Malik's infrastructure argument linking physical design directly to social attitudes."
],
[
"What negative statement did critics make regarding Deepa Malik's athletic future?",
"They claimed that she had aged and would never become a medallist."
],
[
"How did Deepa Malik directly refute the negative claims of her critics?",
"By winning a silver medal at the Paralympic Games."
],
[
"What common error should be avoided when writing analytical paragraphs on themes?",
"Using the theme word as a substitute for detailed explanation and analysis."
],
[
"What central contrast drives the three themes in Chunk DM-06-L3?",
"The contrast between society's passive expectation of disabled people and Deepa's active achievement."
],
[
"What is the key takeaway when analysing literary or prose themes?",
"Connecting a specific moment in the text to a larger truth about universal human experience."
],
[
"An interview question that invites a detailed, personal response is classified as an _____ question.",
"open"
],
[
"Questions referencing an interviewee's past statements demonstrate thorough interviewer _____.",
"research"
],
[
"Contextual framing provides factual _____ to prompt a focused response from an interviewee.",
"background"
],
[
"The 'Ability beyond Disability' mission operates across three levels: personal, institutional, and _____.",
"policy"
],
[
"Deepa Malik assisted in evaluating physical accessibility by auditing _____ Stadium.",
"JLN (Jawaharlal Nehru)"
],
[
"In policy analysis, every identified challenge should be paired directly with a proposed _____.",
"solution"
],
[
"Specialised para-sport coaching programmes should combine disability awareness, coaching skills, and _____.",
"biomechanics"
],
[
"Visible public infrastructure alters social attitudes by increasing overall public _____.",
"awareness"
],
[
"The paragraph structure for themes ends with a sentence linking textual evidence to a _____ connection.",
"wider"
],
[
"Deepa Malik's shift to shot put shows that resilience is strategic adaptation rather than passive _____.",
"endurance"
],
[
"Simply stating that a subject 'showed resilience' without detailed evidence is considered an analytical _____.",
"error"
],
[
"Deepa Malik's silver medal directly challenged society's expectation that disabled individuals are sad and _____.",
"passive"
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
