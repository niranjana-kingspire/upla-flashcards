<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Leaf - O. Henry | Flashcards - L4</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Last Leaf - O. Henry | Flashcards - L4</h1>
    <p class="subtitle">O. Henry · 55 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"In structural character analysis, how is character study performed at Bloom's Analyse level (L4)?",
"By breaking the cast into functional parts and examining how they relate structurally."
],
[
"In *The Last Leaf*, what is Johnsy's narrative function within the cast structure?",
"She functions as the passive centre of crisis."
],
[
"In *The Last Leaf*, what is Behrman's narrative function within the cast structure?",
"He functions as the hidden agent of resolution."
],
[
"What is Sue's narrative function in connecting Johnsy and Behrman?",
"She acts as the visible connector who moves information between the passive centre and the hidden agent."
],
[
"How do Johnsy and Behrman function as structural foils at the opening of the story?",
"Both are failing figures: Johnsy is dying, while Behrman is a forty-year failure as a painter."
],
[
"In what direction does Johnsy's character arc move across the narrative?",
"Her arc moves from passive despair to active recovery."
],
[
"In what direction does Behrman's character arc move across the narrative?",
"His arc moves from passive failure to one decisive, fatal action."
],
[
"At what specific point are the character arcs of Johnsy and Behrman engineered to cross?",
"They are engineered to cross at the painting of the last ivy leaf."
],
[
"What is Johnsy's starting state at the beginning of *The Last Leaf*?",
"She is ill, passive, and has surrendered all hope."
],
[
"What is Behrman's starting state at the beginning of *The Last Leaf*?",
"He is old, unsuccessful, and characterized by talk with no output."
],
[
"What driving belief dictates Johnsy's psychological state during her illness?",
"The fatalistic belief that the falling of the last leaf equals her death."
],
[
"What driving belief characterises Behrman prior to his decisive act?",
"His persistent conviction that he will someday paint a masterpiece."
],
[
"What serves as the structural turning point for Johnsy's recovery?",
"Seeing the last ivy leaf survive the severe storm."
],
[
"What serves as the structural turning point for Behrman's arc?",
"His decision to paint the last ivy leaf himself."
],
[
"What emotional effect is produced by contrasting Johnsy's and Behrman's crossing arcs side by side?",
"It gives the ending emotional force because one character's survival is purchased by the other's death."
],
[
"In the plot's cause-and-effect chain, what immediate effect does Johnsy's fatalistic belief produce?",
"Her physical decline."
],
[
"In the plot's cause-and-effect chain, what action does Johnsy's physical decline trigger in Sue?",
"It leads to Sue's alarm and her appeal to Behrman for help."
],
[
"In the plot's cause-and-effect chain, what direct action is caused by Sue's appeal to Behrman?",
"It leads to Behrman painting the leaf during the storm night."
],
[
"What psychological and physical effect does the painted leaf produce in Johnsy?",
"It produces her psychological and physical recovery."
],
[
"What fatal effect does Behrman suffer as a direct consequence of painting the leaf?",
"He contracts fatal pneumonia from exposure during the storm."
],
[
"Why does the story's ending achieve a bittersweet balance rather than a simple happy resolution?",
"A single action carries two opposite consequences at once: one restorative to Johnsy and one fatal to Behrman."
],
[
"What is Layer 1 in the structural symbolism of the ivy leaf prior to the final reveal?",
"A natural symbol of endurance representing an ordinary piece of the physical world outlasting a storm."
],
[
"What is Layer 2 in the structural symbolism of the ivy leaf after Sue's revelation?",
"An artificial symbol of deliberate human sacrifice representing Behrman's promised masterpiece."
],
[
"How does O. Henry manipulate the symbolism of the leaf without altering the physical object itself?",
"By changing the leaf's structural meaning retroactively from a natural occurrence to human intervention."
],
[
"Complete the symbolic progression chain of the leaf: Natural object $\\rightarrow$ Believed sign $\\rightarrow$ _____ $\\rightarrow$ Retroactive symbol.",
"Human intervention"
],
[
"In the symbolic progression chain of the ivy leaf, what does the natural leaf represent to Johnsy?",
"It represents a believed sign of her own impending fate."
],
[
"How does the symbolism of the ivy leaf contrast with the mango and neem-tree imagery in Unit II?",
"The ivy leaf symbolises fragility and mortality first, whereas mango and neem trees symbolise shelter, comfort, or belonging."
],
[
"What human act converts the ivy leaf from a symbol of mortality into a symbol of art and sacrifice?",
"Behrman painting the leaf onto the wall during the storm night."
],
[
"What general principle about literary symbols in Unit II is demonstrated by comparing the ivy leaf with tree imagery?",
"Symbols are not interchangeable, as each author attaches a distinct structural function to natural objects."
],
[
"What three structural components comprise O. Henry's twist ending?",
"Setup, misdirection, and reveal."
],
[
"What is the structural function of the setup in O. Henry's twist ending?",
"It establishes Johnsy's superstition and leaf countdown, giving the reader a clear but false causal story."
],
[
"How is misdirection achieved in the structural design of *The Last Leaf*?",
"By keeping Behrman almost entirely offstage after his initial angry scene so the reader forgets to suspect him."
],
[
"How is the final reveal structurally delivered at the end of the short story?",
"Through a single compressed paragraph spoken by Sue."
],
[
"What specific information is packed into Sue's single compressed reveal speech?",
"Behrman's illness, his missing lantern and paints, and the true origin of the painted leaf."
],
[
"What structural failure would occur if Behrman were shown painting the leaf on-page?",
"The twist would collapse into ordinary plot progression rather than a dramatic reversal."
],
[
"Why does dramatic irony NOT apply to the ending of *The Last Leaf*?",
"Dramatic irony requires the reader to possess knowledge hidden from the characters, whereas the reader is kept equally in the dark."
],
[
"What specific type of irony operates in the resolution of *The Last Leaf*?",
"Situational irony."
],
[
"Why is the outcome of *The Last Leaf* analytically defined as situational irony?",
"Because the outcome is the exact opposite of expectation: a failed painter saves the heroine rather than fate or medicine."
],
[
"How does O. Henry's twist mechanism differ from a conventional mystery structure?",
"O. Henry withholds the crucial clue almost entirely rather than hiding it in plain sight for the reader to solve."
],
[
"What causal sequence connects the four central themes of *The Last Leaf*?",
"Friendship leads to Self-Sacrifice, which triggers Hope, which results in the Will to Live."
],
[
"Which theme initiates the entire thematic causal chain in *The Last Leaf*?",
"Friendship."
],
[
"What structural role does the theme of Friendship play in initiating the plot?",
"Sue's caring concern is what brings Behrman into the plot to resolve the crisis."
],
[
"What structural role does the theme of Self-Sacrifice serve in the story's thematic chain?",
"It provides the physical action and mechanism that saves Johnsy."
],
[
"How does the theme of Hope operate within the psychological framework of the narrative?",
"It operates psychologically on Johnsy when she observes the leaf surviving the storm."
],
[
"What is the final measurable effect produced by the thematic causal chain?",
"The will to live, demonstrated by Johnsy's physical recovery."
],
[
"What structural consequence occurs if the theme of Friendship is removed from the thematic chain?",
"Behrman's motivation to act is completely removed, breaking the resolution."
],
[
"Which two themes in *The Last Leaf* are structurally classified as external themes?",
"Friendship and Self-Sacrifice."
],
[
"Which two themes in *The Last Leaf* are structurally classified as internal themes?",
"Hope and Will to Live."
],
[
"How are the external themes of Friendship and Self-Sacrifice demonstrated in the plot?",
"They are demonstrated through outward physical actions, such as fetching Behrman and painting in a storm."
],
[
"How are the internal themes of Hope and Will to Live demonstrated in the narrative?",
"They are demonstrated through Johnsy's interior psychological states and mind shift."
],
[
"Why does *The Last Leaf* require both external and internal themes to reach a structural resolution?",
"It requires an outward event (the painted leaf) and an inward shift (Johnsy deciding to live) to resolve the crisis."
],
[
"In the plot's cause-and-effect chain, what connects Behrman's storm-night painting directly to Johnsy's physical recovery?",
"Johnsy seeing an ivy leaf that never falls despite the severe storm."
],
[
"What is Johnsy's role as the narrative object of the plot?",
"She serves as the object of the plot's central question regarding survival."
],
[
"What is the resulting arc for Behrman at the conclusion of his narrative trajectory?",
"A movement from failure to redemptive sacrifice."
],
[
"Why are the main themes in *The Last Leaf* analyzed as a causal chain rather than independent morals?",
"Because each theme structurally triggers the next, making them dependent on one another."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
