<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All About a Dog - A.G. Gardiner | Flashcards - L1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>All About a Dog - A.G. Gardiner | Flashcards - L1</h1>
    <p class="subtitle">A.G. Gardiner · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What physical setting forms the backdrop for the conflict in A.G. Gardiner's \"All About a Dog\"?",
"The narrative takes place inside a public bus on a cold London night."
],
[
"What item of clothing is worn by the woman carrying the Pekinese dog in the essay?",
"The woman is wearing a sealskin coat."
],
[
"What initial demand by the bus conductor triggers the central conflict of the story?",
"He demands that the woman remove her small Pekinese dog from the lower deck of the bus."
],
[
"How do the other bus passengers initially react to the conductor's demand?",
"They protest loudly, side with the sealskin lady, and demand that their fares be refunded."
],
[
"What tactic does the conductor use to force the woman to comply with his order?",
"He stops the bus and refuses to drive until the dog is taken outside."
],
[
"Whose authority does the policeman uphold when called to the scene?",
"He upholds the conductor's authority to enforce bus regulations."
],
[
"Where does the sealskin lady eventually go so that the bus can continue its journey?",
"She goes up to the open top deck of the bus with her dog."
],
[
"What incident allows the sealskin lady to quietly return to the lower deck of the bus?",
"The bus engine breaks down, prompting the conductor to step away."
],
[
"How is the renewed conflict resolved after the conductor finds the dog inside the bus a second time?",
"The narrator stays behind and calmly explains the distinction between the letter and spirit of rules to the conductor."
],
[
"What phrase serves as the conductor's sole defence whenever passengers challenge his actions?",
"His only defence is \"I've got my rules.\""
],
[
"What key takeaway regarding conflict resolution is demonstrated by the outcome of the essay?",
"The conflict escalates through emotional protest and is resolved only through calm reasoning."
],
[
"Term: Bus Conductor (Character Analysis)",
"Definition: A stubborn, cold, and rule-bound official who derives satisfaction from exercising power over passengers."
],
[
"What does the term \"imperturbable\" indicate about the conductor's demeanor during the conflict?",
"It shows that he remains completely calm and unshakeable despite direct confrontation and anger from passengers."
],
[
"Term: Sealskin Lady (Character Analysis)",
"Definition: A well-dressed, confident passenger who asserts her rights and resists authority before ultimately surrendering."
],
[
"What health concern does the sealskin lady's female companion raise during the dispute?",
"She mentions that she suffers from a cough."
],
[
"How does the sealskin lady's male companion dismiss the conductor's actions?",
"He characterizes the entire situation as \"nonsense.\""
],
[
"How does the behaviour of the passenger group change as the dispute prolongs?",
"They start with loud indignation but gradually lose resolve and slip away one by one."
],
[
"What role distinguishes the narrator from all the other passengers on the bus?",
"He acts as a calm observer who stays behind to reason with the conductor instead of protesting angrily."
],
[
"How does the Pekinese dog behave while the dispute rages around it?",
"It sits blinking peacefully at the lights, completely unaware of the commotion it has caused."
],
[
"Complete the quote describing the dog's state: \"The little animal sat blinking at the dim lights in happy unconsciousness of the _____\"",
"rumpus of which he was the cause."
],
[
"Concept: Letter of the Law",
"Definition: Strictly following the exact written text of a rule, regardless of context or practical consequences."
],
[
"Concept: Spirit of the Law",
"Definition: Following the underlying purpose and intent for which a rule was originally created."
],
[
"How does the narrator define \"hard-and-fast\" rules in society?",
"They are absolute rules that must be obeyed strictly because breaking them endangers life and limb."
],
[
"Which example does the narrator provide to illustrate a hard-and-fast rule?",
"The rule of the road."
],
[
"According to the narrator, what is the primary function of \"rules for guidance\"?",
"They exist to assist officials in managing everyday situations with flexibility and practical sense."
],
[
"How does the narrator classify the transit regulation banning dogs on buses?",
"He classifies it as a rule for guidance rather than a hard-and-fast rule."
],
[
"What fundamental error does the conductor commit regarding rule interpretation?",
"He enforces a flexible guidance rule as if it were a rigid, hard-and-fast safety rule."
],
[
"What exact statement does the narrator address to the conductor to point out his mistake?",
"\"You have kept the rule and broken its spirit.\""
],
[
"According to the narrator, rules should be treated not as a whip to scourge passengers, but as authority for an _____.",
"emergency"
],
[
"Term: Light Essay",
"Definition: An informal, conversational prose piece that draws a thoughtful or amusing lesson from an everyday incident."
],
[
"What is the defining characteristic of humour in a light essay?",
"It is gentle, observational, and comic without being malicious or cruel."
],
[
"In what medium were familiar light essays like Gardiner's originally intended to be published?",
"Periodical newspapers."
],
[
"How does the Pekinese dog contribute to the comedic tone of the essay?",
"It serves as a comic innocent, remaining serenely peaceful while causing an enormous public dispute."
],
[
"What literary style is employed when the conductor is compared to \"a captain on the quarterdeck in the hour of victory\"?",
"Mock-heroic style."
],
[
"How does the young male passenger provide situational comedy in the story?",
"He dramatically declares he will stay on the bus all night, but quietly slips away moments later."
],
[
"Cloze: A light essay uses everyday comedy to convey a gentle but _____ observation about human nature.",
"serious"
],
[
"Concept: Theme of Authority",
"Definition: The formal power granted to individuals within an institution to enforce regulations over others."
],
[
"How is institutional authority represented in Gardiner's essay?",
"It is represented by the conductor using bus company regulations to control passenger behaviour."
],
[
"Concept: Theme of Empathy",
"Definition: The ability to understand and acknowledge the feelings and perspective of another person."
],
[
"Why does the narrator's approach succeed in persuading the conductor where anger failed?",
"The narrator demonstrates empathy by acknowledging the conductor's position before offering advice."
],
[
"Concept: Theme of Social Norms",
"Definition: Unwritten societal expectations regarding polite and reasonable interpersonal behaviour."
],
[
"Which social norm expectation held by passengers is violated by the conductor?",
"The expectation that service workers should act with helpful courtesy toward the public."
],
[
"What consequence occurs when authority is exercised without empathy?",
"It becomes petty, rigid, and oppressive."
],
[
"What final interaction between the narrator and conductor signals that courtesy has been restored?",
"The conductor bids the narrator farewell with the words \"Good night quite amiably.\""
],
[
"Which three themes converge when the conductor parts with the narrator \"quite amiably\"?",
"Authority, empathy, and social norms."
],
[
"How does the plot structure build tension prior to the final resolution?",
"It uses repetition, causing the same conflict over the dog to occur twice."
],
[
"Why were the passengers' demands for fare refunds ineffective against the conductor?",
"The conductor relied on his official power to hold the bus, disregarding emotional demands."
],
[
"What structural role does the breakdown of the bus engine play in the narrative?",
"It creates a temporary pause in the conflict, setting up the repetition of the central issue."
],
[
"In Gardiner's analysis, what danger arises from blindly following rules without questioning their intent?",
"It causes unnecessary harm and frustration while violating the rule's original purpose."
],
[
"What quality enables the narrator to successfully communicate with the conductor at the end of the story?",
"His calm, reasonable manner and refusal to engage in aggressive hostility."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
