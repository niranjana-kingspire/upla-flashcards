<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoken English &amp; Broken English - G.B. Shaw | Flashcards - L5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Spoken English &amp; Broken English - G.B. Shaw | Flashcards - L5</h1>
    <p class="subtitle">G.B. Shaw · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What primary social mechanism does Bernard Shaw identify as the key strength of speaking broken English?",
"It signals foreignness to native speakers, thereby activating their cooperative assistance."
],
[
"According to Shaw, why is broken English psychologically and socially effective for a foreign traveller?",
"It clearly indicates non-native status and prompts native listeners to help willingly."
],
[
"What realistic observation does Shaw make about the actual spoken language of Londoners?",
"Most native Londoners speak varied regional dialects rather than standard BBC English."
],
[
"Why is a language learner who expects all native English speakers to sound like BBC announcers ill-prepared?",
"They will struggle to understand the actual, highly varied spoken English used by everyday native speakers."
],
[
"What specific example does Bernard Shaw use to contrast grammatically perfect English with practical broken English?",
"The Charing Cross direction-asking example."
],
[
"How does the Charing Cross example demonstrate the efficacy of broken English?",
"It contrasts two ways of asking for directions to show that broken English produces a faster, clearer response."
],
[
"Why does Shaw's 1927 communication mechanism fail in modern non-native to non-native interactions?",
"It relies on a native speaker being present to recognise foreignness and offer cooperative assistance."
],
[
"How has the primary global role of English changed since Shaw published his essay in 1927?",
"English has evolved into a global lingua franca widely used between non-native speakers."
],
[
"Which specific operational contexts fall outside the scope of Shaw's broken-English recommendation?",
"Professional, academic, and institutional contexts."
],
[
"For what specific types of real-world interactions is Shaw's broken-English advice useful?",
"Casual social interactions and physical navigation."
],
[
"What emotional or personal drawback does Shaw overlook regarding learners using broken English?",
"Learners may feel that deliberately speaking poorly compromises their identity and personal dignity."
],
[
"What main issue regarding learner identity is omitted from Shaw's broken-English argument?",
"How learners feel about performing perceived linguistic inferiority."
],
[
"What is the overall evaluative verdict on Shaw's broken-English argument?",
"It is rhetorically brilliant and practically useful for informal travel, but limited as a universal theory."
],
[
"What fundamental debate in language education does Shaw's text explicitly highlight?",
"Whether language learning aims for contextual communication or a standard that commands social respect."
],
[
"What is Shaw's explicit position regarding the ultimate purpose of learning a language?",
"Effective communication in specific social contexts."
],
[
"According to Shaw, what is the primary metric for measuring language success?",
"Achieving effective communication rather than grammatical correctness."
],
[
"What three core themes structure Bernard Shaw's discourse on spoken language?",
"Language variation, audience awareness, and communication as the primary goal."
],
[
"How does Bernard Shaw ground the abstract concept of language variation in concrete reality?",
"By citing the diverse speech patterns of the members of the BBC advisory committee."
],
[
"What pedagogical effect is achieved by mentioning named, prestigious figures on the BBC committee?",
"It proves that even elite language authorities do not speak with uniform pronunciation."
],
[
"How does Shaw communicate the concept of audience awareness to his listeners?",
"He models audience awareness directly through his delivery in the gramophone recording."
],
[
"Why is Shaw's delivery of the gramophone address an effective demonstration of audience awareness?",
"It illustrates audience awareness through live practice rather than abstract instruction."
],
[
"What rhetorical approach does Shaw use to prove that successful communication outweighs linguistic correctness?",
"Demonstration through practical contrasting examples rather than theoretical assertion."
],
[
"Why is the Charing Cross contrast described as an economically devastating argument?",
"It clearly demonstrates two drastically different practical outcomes using only two short sentences."
],
[
"What major sociolinguistic change limits the present-day application of Shaw's core mechanism?",
"The widespread occurrence of English interactions where no native speaker is present."
],
[
"What social limitation does Shaw fail to address regarding different spoken accents?",
"The structural power inequalities that make certain accents more prestigious or presentable than others."
],
[
"How do structural inequalities affect accent perception across diverse social contexts?",
"They render specific accents socially advantageous while marginalising others regardless of clarity."
],
[
"In what way did Bernard Shaw's 1927 arguments anticipate modern language pedagogy?",
"He prioritised functional communicative competence nearly a century before modern frameworks."
],
[
"Which modern language framework prioritises functional communication over strict grammatical correctness?",
"The Common European Framework of Reference for Languages (CEFR)."
],
[
"Which contemporary language teaching methodology directly mirrors Shaw's focus on functional communication?",
"Communicative Language Teaching (CLT)."
],
[
"Which task-centred pedagogical model reflects Shaw's principle that language is a tool for outcomes?",
"Task-Based Learning (TBL)."
],
[
"What fundamental question does Shaw's focus on communication raise for modern educators?",
"How language should be taught and assessed if accuracy is secondary to communication."
],
[
"What is the final critical judgement regarding the contemporary relevance of Shaw's speech?",
"While constrained by its historical era, its core insight regarding communicative competence remains fully relevant."
],
[
"The mechanism in Shaw's argument where broken English prompts native assistance relies on signaling _____.",
"foreignness"
],
[
"Shaw notes that expecting native speakers to speak BBC English leaves learners unprepared for _____ language.",
"real"
],
[
"Shaw's recommendation to use broken English fails to account for non-native to _____ communication.",
"non-native"
],
[
"Telling foreign learners to speak broken English may feel like asking them to perform _____.",
"inferiority"
],
[
"Modern frameworks like CEFR prioritise communicative competence over linguistic _____.",
"accuracy"
],
[
"Shaw uses the _____ advisory committee as a concrete example of linguistic variation among elites.",
"BBC"
],
[
"Shaw's argument that broken English activates helpfulness assumes a foreign traveller in 1920s _____.",
"Britain"
],
[
"Concept: Communicative Competence in Shaw's Argument",
"Definition: The ability to convey meaning effectively in context regardless of grammatical perfection. Example: Asking for directions in broken English at Charing Cross."
],
[
"What distinction does Shaw make between formal instruction and audience awareness in his speech?",
"He demonstrates audience awareness through his own speech rather than prescribing explicit rules."
],
[
"Why does Shaw's advice regarding broken English fail in professional contexts?",
"Institutional environments demand formal accuracy and standard register for professional credibility."
],
[
"What makes Shaw's observation of London speech democratic in nature?",
"It validates real everyday speech patterns rather than treating elite standards as the sole valid form."
],
[
"How does the global status of modern English alter the sociolinguistic dynamic Shaw described?",
"English is now frequently spoken between non-native speakers who share no native-speaker assistance hierarchy."
],
[
"What is a key limitation of evaluating Shaw's speech strictly through a modern lens?",
"It overlooks the specific 1927 sociolinguistic context for which his practical advice was designed."
],
[
"What does an L5 Bloom's Taxonomy evaluation of Shaw's speech require a student to do?",
"Critically assess the argument's strengths and limitations to justify a reasoned position."
],
[
"What is the main strength of using named figures from the BBC committee in Shaw's argument?",
"It transforms language variation from an abstract concept into an undeniable social fact."
],
[
"Why is assertion considered a weaker rhetorical method than demonstration in Shaw's text?",
"Demonstration directly proves practical outcomes through concrete examples rather than unverified claims."
],
[
"What socio-cultural factor determines whether an accent is perceived as presentable?",
"Structural power dynamics and social hierarchies attached to specific speech patterns."
],
[
"What shared goal connects Communicative Language Teaching, Task-Based Learning, and Shaw's central essay?",
"Placing successful communication above grammatical accuracy as the primary measure of language competence."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
