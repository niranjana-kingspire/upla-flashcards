<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chimney Sweeper - William Blake | Flashcards - L2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Chimney Sweeper - William Blake | Flashcards - L2</h1>
    <p class="subtitle">William Blake · 83 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"How is William Blake's role as an artist described beyond being a poet?",
"He was a visionary artist who combined art and writing to critique society."
],
[
"What was William Blake's primary motivation for writing \"The Chimney Sweeper\"?",
"Direct awareness of the widespread practice of using young boys as chimney sweeps."

[
"What were the major physical health risks for young chimney sweeps?",
"Burns, deformed limbs, and cancer linked to soot exposure."
],
[
"In what year was Blake's \"Songs of Innocence\" first published?",
"1789"
],
[
"How did Blake's professional background differ from mainstream literary circles?",
"He was a poet-engraver working outside the mainstream."
],
[
"On whose behalf did Blake specifically write \"The Chimney Sweeper\"?",
"Real children sold into sweeping work at ages as young as five."
],
[
"How many stanzas make up the poem \"The Chimney Sweeper\"?",
"Four stanzas."
],
[
"How does the speaker's mother die in Stanza 1?",

],
[
"Who sells the speaker into labour as a chimney sweep?",

],
[
"What is the effect of the \"blunt, matter-of-fact language\" used in Stanza 1?",

],
[
"In Stanza 2, what physical trait of Tom Dacre is removed?",

],
[
"What does Tom Dacre's shaved white hair represent?",
"Stripped innocence."

[
"What does the speaker's interaction with Tom Dacre in Stanza 2 demonstrate?",
"Childhood solidarity amid hardship."
],

"What transition occurs in Stanza 3 of the poem?",
"A shift into dream imagery."

[
"In Tom's dream, what are the sweeps trapped inside?",

[
"What do the \"black coffins\" in Tom's dream represent symbollically?",
"Entrapment and the way society has already sealed off the children's futures."
],
[
"Who releases the boys from the coffins in the dream vision?",
"An Angel with a bright key."
],
[
"What do the boys do immediately after being released from the coffins in the dream?",
"They run, leap, and wash in a river/shine in the sun."
],
[
"What does the imagery of \"rising in the dark\" in Stanza 4 signify?",
"The boys' return to the waking world and their grim reality."
],
[
"How does the poem's structure move between reality and fantasy?",
"It moves from harsh reality to comforting fantasy and back again."
],
[
"What does the Angel represent when interpreted critically?",
"How religious promises of an afterlife are used to make people accept present suffering."
],
[
"What does Tom Dacre's white hair symbolise before it is shaved?",
"Unspoiled, lamb-like childhood and purity."
],
[
"What is the symbolic meaning of soot in the poem?",
"Corruption and the lasting mark society's mistreatment leaves on children."
],
[
"How does Blake use Tom's dream vision as a social critique?",
"By contrasting the promise of religious comfort with the unchanged reality of the boys' lives."
],
[
"Which institution does Blake subtly question through the figure of the Angel?",
"The Church."
],
[
"Why did Blake use a dream vision instead of direct social protest?",
"It was safer for him as a writer and allowed readers to reach conclusions themselves."
],
[
"What are the three main themes identified in \"The Chimney Sweeper\"?",
"Child labour, exploitation, and hope."
],
[
"Who are the primary beneficiaries of the exploitation of chimney sweeps?",
"Parents, employers, and a society (including the Church) that looks away."

[
"Why is the theme of \"hope\" in the poem described as ambiguous?",

],
[

"Until the underlying exploitation ends."
],
[
"How does Tom Dacre feel immediately after waking from his dream?",
"He feels happy and warm."
],
[
"What collection is \"The Chimney Sweeper\" a part of?",

],
[
"What is the irony of the poem's inclusion in \"Songs of Innocence\"?",
"It presents a social horror wrapped in a gentle, lullaby-like rhythm."
],
[
"What is the poem's closing reassurance for dutiful boys?",
"That they \"need not fear harm.\""
],
[
"Why is the final line of the poem considered a bitter irony?",
"Because in reality, these boys were in extreme danger of severe harm and death."
],
[
"What technique does Blake use to make the poem's message land more powerfully than a direct protest?",
"Allowing readers to reach the conclusion themselves through imagery and irony."
],
[
"How does the Angel's promise affect the boys' real-world situation?",
"It leaves their real situation entirely unchanged."
],
[
"What does the \"black coffin\" symbolise regarding the boys' living state?",
"Living entrapment or childhood being 'buried' by the trade."
],
[
"What is the purpose of the lullaby-like rhythm in the poem?",
"To make it sound like gentle, simple verse for children while hiding a darker message."
],
[

"It suggests the Church teaches children to endure suffering quietly rather than helping them."

[
"How does the speaker comfort Tom Dacre after his head is shaved?",
"He tells Tom that the soot cannot spoil his white hair now that it is gone."

[
"What is the literal nature of the \"soot\" described in the poem?",

],
[

"Songs of Experience."
],
[
"What does the Angel's key represent in the context of the dream?",
"Divine rescue or release from earthly suffering."
],
[
"How does the poem's perspective on hope change when read as an adult aware of mortality rates?",
"The hope appears practically empty and the reassurance reveals bitter irony."
],
[
"Blake is described as writing from \"direct awareness\" of what?",
"A real social problem (child labour/chimney sweeping)."
],
[
"What is the \"duty\" the boys return to in Stanza 4?",

[
"In Stanza 1, how does the speaker characterize the loss of his mother and sale by his father?",
"As an event that makes his suffering sound almost normal due to common exploitation."
],

[
"What does the green plain and river in the dream symbolize?",

[
"Concept: Poet-Engraver",
"Definition: William Blake's profession, involving writing and visual art to critique 18th-century society."
],
[
"Concept: Climbing Boys",
"Definition: A term for young boys, often bought from poor families, used as chimney sweeps due to their small size."

[
"How does the speaker's tone in Stanza 1 contribute to the poem's social commentary?",
"The bluntness highlights how society had become desensitised to child exploitation."

[
"Why is the Angel's comfort described as a tool of the status quo?",
"It encourages children to be \"good\" and compliant within an abusive system."
],
[
"What is the significance of the boys rising in the \"dark\" in the final stanza?",
"It underscores that the promised light of the dream was only a temporary illusion."
],
[
"What is the primary function of imagery in the poem according to the text?",
"To deepen meaning rather than just move the plot along."
],
[
"How does Blake view the role of \"institutions\" in the lives of the poor?",
"As entities that offer empty comfort instead of facilitating real social change."
],
[
"What does the \"white hair\" comparison to a lamb's back evoke?",
"Sacrificial innocence and purity."
],
[
"What does the speaker's cry of \"'weep 'weep 'weep 'weep\" represent?",
"His inability to even pronounce the word \"sweep,\" emphasizing his extreme youth."
],
[
"In the dream, the boys wash in a _____ and shine in the _____.",
"river; sun."
],
[
"The poem is described as a \"gentle-sounding _____ _____.\"",
"social commentary."
],
[
"Blake's Songs of Innocence was designed to sound like verse for _____.",
"children."
],
[
"The _____ in the dream represents a promise of rescue without changing real conditions.",
"Angel."
],
[
"The \"black coffins\" symbolise that the children are treated as _____ while still alive.",
"dead."
],
[
"What does the speaker use to comfort Tom Dacre about his shaved head?",
"The idea that soot cannot get into his hair if he has none."
],
[
"According to the summary, what does the image of \"sunshine\" in the dream represent?",
"An imagined escape from the darkness of the sweeps' reality."
],
[
"How does Blake's choice of narrator (a child) affect the poem's irony?",
"The child's naive acceptance of suffering makes the reader's awareness of the horror more intense."
],
[
"What is the \"scandal\" Blake critiques regarding parents in the poem?",
"Parents selling their young children into dangerous labour out of economic desperation."
],
[
"What is the \"distinctive cancer\" mentioned in the context of 18th-century chimney sweeps?",
"Cancer later linked specifically to soot exposure."
],
[
"Why is the rhythm of the poem described as \"lullaby-like\"?",
"To mimic the simple, comforting style expected of children's poetry."
],
[
"What does the speaker say about the weather on the morning the boys return to work?",
"The morning was cold."
],
[
"What do the boys carry as they head to work in Stanza 4?",
"Bags and brushes."
],
[
"The Angel tells Tom that if he does his duty, he will never want for _____.",
"joy."
],
[
"The contrast between the \"white hair\" and the \"black coffins\" emphasizes the theme of _____ vs. _____.",
"innocence; corruption (or life; death)."
],
[
"How does Bloom's Taxonomy classify these study notes?",
"L2 â€” Understand."
],
[
"Who compiled the notes provided in the source material?",
"Krishnapriya."
],
[
"What does the \"Angel's key\" specifically unlock in Tom's dream?",
"The black coffins holding the sweeps."
],
[
"In the dream, where do the boys leave their bags?",
"Behind them, on the clouds."
],
[
"What does the phrase \"deceptively simple\" imply about Blake's writing style?",
"It appears easy to read but contains complex social and moral messages."
],
[
"What is the intended effect of the \"gap between tone and truth\" in the poem?",
"It functions as quiet social criticism."
],
[
"How does the Speaker describe his own voice in Stanza 1?",
"Scarcely able to cry \" 'weep! 'weep! 'weep! 'weep! \"."
],
[
"What is the primary message of Stanza 4 regarding the dream?",
"That the hope provided by the dream does not change the physical suffering of the boys."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
