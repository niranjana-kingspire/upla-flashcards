<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still I Rise - Maya Angelou | Flashcards - L4</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Still I Rise - Maya Angelou | Flashcards - L4</h1>
    <p class="subtitle">Maya Angelou · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"In 'Still I Rise', how do the poetic devices interact to create a structural pattern?",
"They form a single sequence of escalation and release."
],
[
"Which specific device in stanzas 1 and 5 builds a rhythm of repeated attack?",
"Anaphora (the 'You may...' sequences)."
],
[
"What structural role does the final repetition of 'I rise' perform?",
"It provides a resolution to the tension built by the anaphora."
],
[
"How does the use of elemental metaphors (dust, air) affect the reader's perception of the final 'rise'?",
"It makes the triumph feel as certain as a law of nature."
],
[
"Comparing the two metaphors, 'dust' in stanza 1 is described as being _____.",
"Heavy, earthbound, and visibly oppressed."
],
[
"How does the 'air' metaphor in stanza 5 differ from the 'dust' metaphor in stanza 1?",
"Air is invisible and ungraspable, whereas dust can be trodden into the ground."
],
[
"What does the shift from 'dust' to 'air' metaphors mirror in the poem's structure?",
"A parallel escalation from reputation-based harm to direct, physical violence."
],
[
"Why does the speaker use the metaphor of 'air' when facing more severe threats?",
"To suggest that as attacks intensify, the speaker becomes more untouchable."
],
[
"In Table 3, what is the nature of the attacks described in Stanza 1 ('You may...')?",
"Reputation and narrative control (e.g., writing lies)."
],
[
"In Table 3, what is the nature of the attacks described in Stanza 5 ('You may...')?",
"Direct, physical violence (e.g., shooting, cutting, killing)."
],
[
"What is the specific function of Stanza 5's anaphora sequence in the poem's overall structure?",
"It escalates the pattern to its highest stakes just before the final release."
],
[
"How are the three themes of 'Still I Rise' (Oppression, Racial Identity, Female Empowerment) related?",
"They form a causal chain rather than existing as separate topics."
],
[
"In the poem's thematic causal chain, what acts as the 'external cause'?",
"Oppression (lies, hatred, and violence directed at the speaker)."
],
[
"How does the poem explicitly connect the speaker's personal suffering to racial identity?",
"By referencing the collective memory of slavery ('the dream and the hope of the slave')."
],
[
"In the thematic causal chain, what is the final effect of the speaker's resistance?",
"Female empowerment (embodied, personal confidence and pride)."
],
[
"Why does the speaker's personal confidence carry meaning beyond herself?",
"Because her empowerment is rooted in a larger racial history of resistance."
],
[
"How does female empowerment loop back to the start of the causal chain?",
"It directly answers and undermines the original oppression."
],
[
"What does it mean for the poem's themes to be 'structurally fused'?",
"They are combined within individual word choices rather than running in parallel."
],
[
"Example: The word '_____' carries a racial history while serving as a source of gendered pride.",
"Sassiness"
],
[
"Historically, what was the pejorative purpose of the word 'sassiness'?",
"It was used to police the behaviour of Black women."
],
[
"How does 'Still I Rise' reclaim the term 'sassiness'?",
"It transforms a racially coded judgement into a badge of confidence."
],
[
"What is the rhetorical goal of Blake's dark imagery in 'The Chimney Sweeper'?",
"To provoke pity and highlight suffering that the narrator cannot fully see."
],
[
"Why does Ramanujan use natural and domestic imagery in 'Ecology'?",
"To keep the tone ambivalent, balancing both harm and value."
],
[
"What is the rhetorical goal of Angelou's imagery of material wealth (e.g., oil wells)?",
"To signal abundance rather than lack and assert deserved triumph."
],
[
"How does the imagery in 'Still I Rise' support the theme of inevitability?",
"By using natural cycles (moons, tides) that cannot be stopped."
],
[
"Comparing agency: Why is the child narrator in Blake's poem considered a 'reactive' figure?",
"He is unaware of his exploitation and does not understand his own suffering."
],
[
"How does the mother's agency in 'Ecology' compare to the speaker in 'Still I Rise'?",
"The mother accepts a trade-off (medium agency), while the speaker actively confronts the source of harm."
],
[
"What structural element in 'Still I Rise' marks the speaker's high level of agency?",
"Directly confronting the oppressor with questions (e.g., 'Does my sassiness upset you?')."
],
[
"In Table 5, what type of imagery is associated with 'The Chimney Sweeper'?",
"Dark and industrial (e.g., soot, black coffins, locked chimneys)."
],
[
"In Table 5, what type of imagery is associated with 'Ecology'?",
"Natural and domestic (e.g., pollen fog, twisted silver)."
],
[
"In Table 5, what type of imagery is associated with 'Still I Rise'?",
"Natural and material (e.g., dust, air, oil wells)."
],
[
"How does the rhetorical effect of 'The Chimney Sweeper' differ from 'Still I Rise'?",
"Blake provokes pity via limited understanding, while Angelou asserts certain triumph."
],
[
"Which of the three poems features a speaker who accepts a trade-off rather than resisting?",
"'Ecology' (the mother)."
],
[
"Which of the three poems features a speaker who is largely unaware of their exploitation?",
"'The Chimney Sweeper'."
],
[
"Trace the escalation of resilience: 'trod... like dust' (stanza 1) leads to '_____' (stanza 5).",
"Kill... like air"
],
[
"What does the 'twisted silver' imagery in 'Ecology' represent rhetorically?",
"An ambivalent balance between harm and value."
],
[
"Why is the use of 'oil wells' and 'gold mines' significant in Angelou's imagery?",
"They represent material wealth and a lack of deficit/lack."
],
[
"In the thematic chain, which concept explains *why* oppression carries historical weight?",
"Racial identity."
],
[
"What does the interaction of anaphora and repetition achieve at the poem's close?",
"The release of accumulated pressure through resolution."
],
[
"Under L4 analysis, what is the problem with separating the poem's themes into independent boxes?",
"They are better understood as one another's cause and effect."
],
[
"What structural pairing is shown by the shift from reputation-based attacks to violent threats?",
"The speaker's chosen metaphor for resilience becomes more untouchable."
],
[
"How does 'Still I Rise' differ structurally from the other two poems regarding the source of harm?",
"It is the only poem where the speaker directly addresses the source of harm."
],
[
"In 'The Chimney Sweeper', what specific image represents the children's lack of freedom?",
"A locked chimney."
],
[
"What is the relationship between rhetorical goals and imagery in Angelou's poem?",
"Imagery is chosen to support an assertion of certain, deserved triumph."
],
[
"Term: Anaphora sequences in 'Still I Rise'",
"Definition: Repeated 'You may...' phrases that build a rhythm of accumulating pressure/attack."
],
[
"How does the speaker's racial identity connect to her 'personal confidence'?",
"Her confidence becomes a form of resistance rooted in collective history."
],
[
"Which metaphor suggests a substance that is earthbound and visibly oppressed?",
"Dust (Stanza 1)."
],
[
"The phrase 'the dream and the hope of the slave' is an example of which theme?",
"Racial identity."
],
[
"What is the structural effect of using metaphors of 'natural inevitability'?",
"It primes the reader to accept the speaker's 'rise' as an unstoppable law."
],
[
"Why is the speaker in 'Still I Rise' described as having 'High' agency?",
"Because she declares an active, ongoing victory and confronts her oppressor."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
