<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Giant&#x27;s Wife - William Carleton | Flashcards - L2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Giant&#x27;s Wife - William Carleton | Flashcards - L2</h1>
    <p class="subtitle">William Carleton · 55 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What was William Carleton's primary motivation for recording rural Irish folk tales?",
"He aimed to preserve the voice, humour, and imagination of ordinary Irish people before industrialisation and colonisation erased them."
],
[
"In what way did William Carleton's upbringing shape the narrative style of 'The Giant's Wife'?",
"Growing up in a rural Irish storytelling community led him to adopt an exaggerated, lively tone characteristic of oral performance."
],
[
"Which 1888 publication by W.B. Yeats featured William Carleton's version of the tale?",
"It was included in Yeats's 1888 anthology of Irish folklore during the Irish Literary Revival."
],
[
"What was the primary cultural goal of the Irish Literary Revival in the late 19th century?",
"It sought to reclaim Irish national identity through literature and folklore rather than British colonial narratives."
],
[
"How does the Reader's Theatre format support classroom instruction of dramatic literature?",
"It allows students to practise expressive oral reading, distinguish dialogue from narration, and grasp dramatic structure."
],
[
"What weakness does Fin MacCool display despite possessing a magic thumb that warns him of danger?",
"His thumb provides warning of approaching danger but offers no solution, leaving him completely paralysed by fear."
],
[
"In 'The Giant's Wife', Oona asks Cuhullin to turn the house around and split a mountain primarily to _____.",
"test his physical capabilities and plant seeds of doubt about Fin's superior strength"
],
[
"Which psychological vulnerability does Oona target when setting Cuhullin the initial domestic tasks?",
"She targets his intense pride, compelling him to prove his strength even to a housewife."
],
[
"How does the iron-griddle bread physically damage Cuhullin during his encounter with Oona?",
"It breaks Cuhullin's front teeth when he attempts to bite into bread allegedly eaten daily by Fin."
],
[
"What psychological impression is created when the disguised 'baby' Fin easily eats the safe loaf?",
"It convinces Cuhullin that Fin's infant possesses extraordinary physical power, shattering his remaining confidence."
],
[
"Which psychological vulnerability in Cuhullin is exploited by Oona to strip him of his magical forefinger?",
"She exploits his curiosity about Fin's strength to make him voluntarily put his finger into the 'baby's' mouth."
],
[
"What makes Cuhullin's ultimate defeat structural rather than physical?",
"He defeats himself by voluntarily taking every destructive step under Oona's invisible guidance."
],
[
"How does Oona demonstrate strategic thinking prior to Cuhullin's arrival?",
"She identifies Cuhullin's specific weaknesses and outlines a plan to exploit his magical forefinger before he arrives."
],
[
"How does Oona demonstrate resourcefulness when Cuhullin unexpectedly succeeds in turning the house?",
"She remains entirely composed and immediately adapts her narrative without showing any surprise."
],
[
"How does Oona's form of heroism contrast with conventional folk tale heroism?",
"Her heroism is cognitive and domestic, relying on strategic intelligence and composure rather than physical combat."
],
[
"What thematic contrast is established between Fin MacCool and Oona during the crisis?",
"Fin possesses legendary physical strength and magical warnings but hides, whereas Oona lacks these advantages yet resolves the threat."
],
[
"What does Oona's final remark, \"Don't be too hard on the poor thing!\", reveal about her character?",
"It reveals her generosity of spirit and magnanimity in viewing her enemy as a foolish creature rather than a villain."
],
[
"What is the primary artistic purpose of hyperbole and exaggeration in tall tales?",
"Exaggeration serves as a vehicle for visual humour, playful tone, and the celebration of extraordinary human limits."
],
[
"How does the tall tale format treat impossible physical feats within the narrative world?",
"It treats extraordinary and impossible feats as routine occurrences within an ordinary domestic setting."
],
[
"Why are the legendary origins of Fin MacCool and Cuhullin culturally significant to the story?",
"They connect the narrative to centuries of authentic Irish oral tradition, giving the story cultural resonance."
],
[
"What structural role do the four narrators play in the Reader's Theatre adaptation?",
"They divide the descriptive narration to maintain dynamic pacing and involve multiple readers in storytelling."
],
[
"Which element of oral storytelling performance is directly retained through Fin's line \"That's me name!\"?",
"Direct address to the audience."
],
[
"Why would reading 'The Giant's Wife' as a silent prose text diminish its comedic impact?",
"Silent reading flattens the expressive vocal delivery, dynamic roars, and performance-based humour written for spoken execution."
],
[
"How does 'The Giant's Wife' demonstrate that intelligence is superior to brute physical force?",
"Oona systematically neutralises Cuhullin's mountain-splitting strength using non-violent psychological deception."
],
[
"What does Fin MacCool's inability to act illustrate about physical strength in times of crisis?",
"Having immense physical power is useless without the composure and tactical wit required to execute a plan under pressure."
],
[
"How does Carleton communicate his thematic message regarding gender roles in 'The Giant's Wife'?",
"He structurally places the female character in the hero role and the male giant in a baby cradle without explicit moralising."
],
[
"What comedic image visually reinforces the reversal of traditional gender roles in the play?",
"The image of the legendary giant Fin MacCool disguised in a baby nightgown and sucking a bottle in a cradle."
],
[
"According to the analysis of 'The Giant's Wife', how is true heroism defined?",
"Heroism is defined by the practical capacity to resolve a crisis effectively through composure and intellect."
],
[
"The three central themes of 'The Giant's Wife' are wit versus brute power, gender roles, and _____.",
"heroism"
],
[
"How does Oona's manipulation of Cuhullin's pride initiate his eventual downfall?",
"By compelling him to perform exhausting feats to prove his strength, she lays the groundwork for doubting his supremacy."
],
[
"What role does hospitality play in Oona's tactical strategy against Cuhullin?",
"She uses traditional domestic hospitality, such as offering bread, as a harmless cover for physical and psychological sabotage."
],
[
"What mechanism provides Fin MacCool with advance knowledge of Cuhullin's approach?",
"Sucking his magical thumb gives him premonitions of impending danger."
],
[
"Why does Fin MacCool refuse to flee despite his overwhelming terror of Cuhullin?",
"He fears he will be permanently shamed if he runs away from his rival."
],
[
"What physical evidence remains after Cuhullin completes the task of splitting the mountain?",
"A visible split in the mountain rock."
],
[
"What specific ingredient does Oona bake into Cuhullin's griddle-bread?",
"An iron griddle hidden inside the dough."
],
[
"How does Cuhullin react immediately after biting into Oona's custom griddle-bread?",
"He roars in pain after breaking his two front teeth on the hidden iron."
],
[
"What false claim does Oona make to Cuhullin regarding the iron-griddle bread?",
"She claims that Fin eats six dozen of those exact loaves every single day."
],
[
"What source of magical power does Cuhullin possess that Oona targets in Stage 3?",
"His magical forefinger, which contains the core of his strength."
],
[
"How does Oona trick Cuhullin into placing his magical forefinger inside the cradle?",
"She invites him to feel the teeth of the 'baby' to check how strong Fin's offspring is."
],
[
"What happens to Cuhullin's magical forefinger when he sticks it into the disguised Fin's mouth?",
"Fin bites it off, instantly destroying Cuhullin's magical power and physical supremacy."
],
[
"In the context of oral storytelling, what function do dialect markers like \"Ach\" perform?",
"They preserve authentic regional speech patterns and recreate the vocal warmth of traditional Irish storytellers."
],
[
"What makes Oona's response to Cuhullin's mountain-splitting feat an example of composure under pressure?",
"Rather than panicking when he succeeds, she calmly treats the incredible feat as an everyday chore."
],
[
"How does Oona's final act of mercy round out her status as a classical hero?",
"It completes the heroic archetype by showing magnanimity and lack of malice toward a defeated opponent."
],
[
"What stylistic choice signals to the audience that the extreme violence in tall tales is non-threatening?",
"The exaggerated, playful tone and domestic setting signal that the events are humorous play rather than real danger."
],
[
"What pedagogical benefit arises from using legendary folk figures in educational texts?",
"It introduces learners to shared cultural inheritance and literary heritage through engaging storytelling."
],
[
"How does Cuhullin's self-perception contribute to his vulnerability against Oona?",
"His supreme overconfidence in his own physical power leads him to misjudge Oona as a harmless housewife."
],
[
"What structural reversal occurs between Fin MacCool and Cuhullin by the end of the narrative?",
"The legendary hero who was paralysed by fear ends up victorious, while the undefeated conqueror leaves broken."
],
[
"Which specific narrative technique ensures that the audience remains connected to the dramatic action in Reader's Theatre?",
"Direct character address and dynamic chorus-style narration."
],
[
"Why is cognitive power shown to be superior to magical power in 'The Giant's Wife'?",
"Magic power relies on fixed rules or objects, whereas cognitive power allows Oona to adapt flexibly to fluid situations."
],
[
"What role does William Carleton occupy in the history of Irish folk literature?",
"He acts as a key preserver of 19th-century Irish oral tradition by converting spoken folk tales into written literature."
],
[
"How does Oona turn Cuhullin's own physical feats into evidence of Fin's superiority?",
"She dismisses Cuhullin's feats as minor household chores that Fin performs routinely without effort."
],
[
"What detail about the 'baby' bread convinces Cuhullin that Fin's family is beyond his strength?",
"The baby easily bites through a loaf that Cuhullin assumes is identical to the tooth-shattering iron bread."
],
[
"How does the domestic context of the kitchen alter the traditional epic battle setting?",
"It shifts the battleground from a field of physical combat to a domestic space controlled entirely by Oona's rules."
],
[
"Why is Oona's heroism considered non-combative?",
"She defeats the enemy using food, hospitality, and psychological manipulation without initiating physical violence."
],
[
"What primary thematic conclusion does 'The Giant's Wife' reach regarding domestic intellect?",
"It demonstrates that domestic wit and tactical intelligence can disarm even the most formidable external physical threat."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
