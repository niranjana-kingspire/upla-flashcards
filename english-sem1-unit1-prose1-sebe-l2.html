<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoken English &amp; Broken English - G.B. Shaw | Flashcards - L2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Spoken English &amp; Broken English - G.B. Shaw | Flashcards - L2</h1>
    <p class="subtitle">G.B. Shaw · 51 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What medium was originally used to distribute G.B. Shaw's speech Spoken English and Broken English?",
"It was originally distributed as an audio recording sold for classroom use."
],
[
"How does Shaw open his speech to address a technical limitation of the audio medium?",
"He addresses a technical problem regarding gramophone turntable speed distortion."
],
[
"Which advisory body did Shaw serve on that influenced his views on English pronunciation?",
"He served on the BBC advisory committee on spoken English."
],
[
"What finding regarding the BBC pronunciation committee forms the foundation of Shaw's central argument?",
"The educated committee members could not agree on the correct pronunciation of basic words like \"yes\" and \"no\"."
],
[
"Which two groups constitute the primary intended audience for Shaw's speech?",
"Foreign language learners and native speakers with regional or Cockney dialects."
],
[
"Why does native regional or Cockney dialect concern one group of Shaw's intended audience?",
"Native dialect speakers fear their regional speech patterns will limit their employment opportunities."
],
[
"How is the overall tone adopted by Shaw throughout his speech described?",
"His tone is conversational, self-mocking, authoritative, and sardonic."
],
[
"What primary point does Shaw illustrate through the anecdote of the MacDonald gramophone?",
"He demonstrates that pronunciation changes with mechanical conditions, making correct speech a moving target."
],
[
"According to Shaw, why is demanding perfectly correct speech in direct communication unrealistic?",
"Direct voice communication is inherently imperfect and subject to variable conditions."
],
[
"How does Shaw's background as a playwright and BBC advisor give him authority on spoken English?",
"His experience gives him practical insight into public speaking, speech reception, and language variation."
],
[
"What paradoxical phenomenon does Shaw describe regarding foreigners speaking flawless English?",
"The more perfectly a foreigner speaks English, the harder it is for native speakers to understand them."
],
[
"Why does phonetically formal English spoken by a non-native speaker confuse native listeners?",
"Non-native speakers fail to replicate native stress, rhythm, and intonation patterns, frustrating listener expectations."
],
[
"What cognitive shift occurs in a native listener when a foreigner speaks broken English?",
"The native listener enters a foreigner-assistance mode focused on simplifying speech and aiding comprehension."
],
[
"What psychological reaction makes a native speaker willing to assist someone using broken English?",
"The native speaker feels pleased with their own cleverness in successfully decoding the foreigner's meaning."
],
[
"How far does Shaw extend his principle regarding the effectiveness of broken language?",
"He asserts that the principle applies to learning and speaking any foreign language."
],
[
"According to Shaw, how is a native speaker perceived if they speak too well in ordinary conversation?",
"They are perceived as displaying pedantic affectation and appearing stiff or socially awkward."
],
[
"What social outcome is created when a listener actively decodes broken English?",
"It establishes a cooperative social bond between the speaker and the listener."
],
[
"Why does Shaw consider the concept of correct English to be an impossible standard?",
"Correctness implies a single fixed standard that does not exist even among language experts."
],
[
"How does Shaw define presentable English?",
"Presentable English is speech that communicates successfully without stigmatising the speaker as uneducated."
],
[
"What social advantage does presentable English provide to native dialect speakers?",
"It grants social mobility by removing employment barriers linked to regional speech."
],
[
"What goal does Shaw recommend foreign learners aim for instead of sounding like native speakers?",
"Learners should aim for intelligibility and social acceptability rather than phonetic perfection."
],
[
"How does Shaw characterise his own tone when offering advice to foreign language learners?",
"He adopts a sympathetic and non-prescriptive tone focused on practical success."
],
[
"What evidence from the BBC committee supports the claim that presentable English admits regional accents?",
"Committee members spoke presentably despite possessing distinct Irish, Scottish, Welsh, or American accents."
],
[
"On what basis does Shaw measure the standard of presentable English?",
"He measures it by social reception and communicative success rather than abstract phonetic rules."
],
[
"Why do speakers naturally adopt incomplete phrasing when using home manners?",
"Shared context and familiarity allow close companions to decode partial phrases effortlessly."
],
[
"What challenge do language learners face when transitioning from textbook English to native environments?",
"Textbooks teach formal English, whereas native speakers predominantly use contextually compressed speech."
],
[
"What warning does Shaw implicitly give foreign learners regarding BBC-style English?",
"Learners should not assume that native speakers always speak in formal BBC style in everyday life."
],
[
"What register of speech is governed by the presentable English standard?",
"The presentable standard applies specifically to company manners, or public and professional interactions."
],
[
"How would Shaw's wife react if he spoke to her at home using formal company manners?",
"She would consider his behaviour absurd and assume he had lost his mind."
],
[
"What detail from Shaw's domestic life demonstrates that expert speakers adjust clarity at home?",
"His wife frequently complains about his domestic speech by telling him not to mumble."
],
[
"What overarching principle governs speech variation between domestic and public settings?",
"Speech is inherently contextual, requiring appropriate registers for specific social situations."
],
[
"What two cues trigger a native listener's helpful attitude toward a foreign speaker?",
"Broken grammar and a heavy foreign accent trigger immediate listener assistance."
],
[
"How does broken English flatter a native listener's self-perception?",
"It flatters the listener by making them feel clever for successfully deciphering the intended meaning."
],
[
"Why does an attempt at formal English perfection by a non-native speaker produce cognitive dissonance?",
"Mismatches between expected native intonation and non-native execution strain the listener's mental processing."
],
[
"Why does Shaw describe speaking English too well as an insult to a native speaker?",
"Native speakers cannot easily understand their own language when it is spoken with artificial phonetic perfection."
],
[
"How does broken English function as an effective linguistic strategy?",
"It acknowledges the speaker's limitations, inviting empathy and cooperative assistance from the listener."
],
[
"What social status does a foreign speaker hold that makes native listeners curious and welcoming?",
"The foreign speaker represents a novel social occasion rather than an inconvenience."
],
[
"What three main themes interact to form Shaw's overall philosophy of speech?",
"Language variation, audience awareness, and communication as the ultimate goal."
],
[
"How does Shaw demonstrate that language variation is a natural state rather than an error?",
"He highlights disagreements among BBC experts and variations in his own domestic speech."
],
[
"What is the main implication of language variation for language reformers?",
"Attempting to standardise a living language into a single fixed form is impossible and counterproductive."
],
[
"How does Shaw define effective audience awareness in spoken communication?",
"It is the ability to read one's audience and adapt one's speech register accordingly."
],
[
"How is communicative success evaluated in Shaw's framework?",
"Success is measured by whether meaning is effectively transmitted, not by grammatical perfection."
],
[
"What role does audience awareness play in relation to language variation and communication goals?",
"Audience awareness is the skill that allows speakers to navigate language variation and achieve communication."
],
[
"Which anecdote in Shaw's speech simultaneously illustrates variation, audience awareness, and communicative success?",
"The anecdote detailing the debate among members of the BBC pronunciation committee."
],
[
"The phenomenon where a listener alters their speaking style to assist a non-native speaker is called entering _____ mode.",
"foreigner-assistance"
],
[
"What expectation mismatch occurs when a foreigner attempts phonetically formal English?",
"Listeners expect native stress and intonation patterns that fail to arrive, causing confusion."
],
[
"Why does Shaw describe company manners in speech as requiring conscious effort?",
"Careful articulation requires physical and mental exertion that speakers relax when in comfortable settings."
],
[
"What effect does a heavy regional dialect have on native job seekers in Britain according to Shaw?",
"Regional dialects can act as social barriers that limit employment opportunities in certain professions."
],
[
"According to Shaw, what is the primary function of language in any practical setting?",
"The primary function of language is to transmit meaning and facilitate human understanding."
],
[
"The speech register appropriate for polite dinner conversations or public addresses is termed _____ manners.",
"company"
],
[
"The speech register characterized by mumbled words and compressed phrasing among family members is termed _____ manners.",
"home"
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
