<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Giant&#x27;s Wife - William Carleton | Flashcards - L5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Giant&#x27;s Wife - William Carleton | Flashcards - L5</h1>
    <p class="subtitle">William Carleton · 52 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What critical task is required at Bloom's Taxonomy Level L5 (Evaluate) when studying Carleton's 'The Giant's Wife'?",
"Assessing how effectively Carleton communicates core themes and judging the lasting relevance of his arguments on gender, heroism, and intelligence."
],
[
"Why is Carleton's presentation of wit versus brute power considered highly effective?",
"The argument is structurally demonstrated three times through plot events rather than directly asserted to the audience."
],
[
"What specific concrete event makes the ultimate defeat of brute power by wit irreversible in 'The Giant's Wife'?",
"Cuhullin fleeing in terror after the fake baby bites off his finger."
],
[
"Through what literary strategy does Carleton convey his thematic argument regarding gender in 'The Giant's Wife'?",
"Through narrative structure rather than explicit direct statement."
],
[
"Why is Carleton's decision to avoid explicitly stating 'women are as capable as men' advantageous to the story's reception?",
"It prevents the narrative from being dismissed as agenda-driven or moralising propaganda."
],
[
"How does 'The Giant's Wife' enable the audience to reach their own conclusions about female capability?",
"By depicting a woman succeeding through strategy where male physical strength fails."
],
[
"In what way does Oona's heroism mirror the structure of conventional male heroism?",
"It follows the standard hero trajectory of recognising the threat, planning, executing, winning, and showing mercy."
],
[
"How does Oona's heroic method radically depart from traditional heroic tropes?",
"She achieves victory entirely through intellect and strategy, using zero combat or magic."
],
[
"Why is Oona's method of resolving conflict considered the most subtle yet powerful theme in the adaptation?",
"It forces a fundamental reconsideration of what constitutes a heroic action."
],
[
"In the context of Carleton's tall tale, what is the primary consequence of 'comic distance'?",
"It causes the audience to laugh at characters like Fin in the cradle rather than empathising with them emotionally."
],
[
"How does the tall tale format limit the emotional depth of Carleton's thematic argument?",
"It renders the thematic conclusions intellectually clear but emotionally unmoving."
],
[
"Why does the neat and humorous resolution of the tall tale format create a thematic constraint?",
"It presents victory as triumphant and simple, failing to illuminate the real-world complexity of navigating gendered inequality."
],
[
"Why does the debate between wit and brute power in 'The Giant's Wife' remain permanently relevant?",
"Society continues to harbour assumptions that physical strength is the primary metric of power."
],
[
"Why does Oona's depiction of intelligence remain socially relevant across eras?",
"It directly challenges persistent societal assumptions that female intelligence is secondary to male power."
],
[
"According to evaluative analysis, why is showing an argument structurally more persuasive than stating it directly?",
"Audiences formulate the conclusion themselves, leading to deeper personal conviction and ownership of the idea."
],
[
"How does comedic humor make the thematic gender reversal palatable to resistant audiences?",
"Laughing at the absurdities lowers audience defences, allowing them to accept the structural reversal without feeling confronted."
],
[
"What image provides the central structural gender reversal regarding male physical dominance in the play?",
"Fin MacCool, a powerful giant, forced to hide helplessly in a baby's cradle."
],
[
"What structural role does Oona occupy that reverses conventional giant-tale gender dynamics?",
"Acting as the sole manager and defender in a crisis, relying on non-magical, human wit."
],
[
"Why do literary works that deliver gender arguments through explicit direct statements risk becoming dated?",
"Direct assertions often feel like preachy propaganda specific to their era, whereas structural demonstrations remain timeless."
],
[
"What constitutes both the greatest strength and potential flaw of Carleton's adapted tall tale?",
"Its high entertainment value makes the argument highly persuasive yet risks audiences missing the deeper commentary entirely."
],
[
"Which final step in Oona's strategic sequence aligns her action directly with traditional heroic moral codes?",
"Showing mercy to her defeated adversary rather than destroying him."
],
[
"What risk does an analytical critique identify regarding passive viewers of 'The Giant's Wife'?",
"They may enjoy the play purely as light entertainment without registering its underlying social critique."
],
[
"Why is structural argument described as 'more durable' across time than declarative thematic claims?",
"It creates a narrative world that operates naturally on the argument's terms without asking the audience to assent to a doctrine."
],
[
"Why is it significant that Oona relies on zero magic to defeat Cuhullin?",
"It grounds her heroism in human resourcefulness and intellect, making her triumph grounded and relatable."
],
[
"Placing the mighty giant Fin MacCool inside a cradle creates _____ distance, encouraging laughter rather than empathy.",
"comic"
],
[
"What is the final evaluative verdict on Carleton's structural approach to gender commentary in 'The Giant's Wife'?",
"It is the optimal strategy for the genre, successfully balancing engaging entertainment with precise social critique."
],
[
"How many times is the superiority of wit over brute force structurally demonstrated in the narrative trajectory?",
"Three times."
],
[
"How does Oona's heroism differ from conventional heroism in terms of method, despite sharing the same structural steps?",
"Conventional heroism relies on physical combat or magic, whereas Oona relies entirely on strategy and intellect."
],
[
"Stories that state their social themes directly risk feeling dated and _____, whereas structural demonstrations remain relevant longer.",
"preachy"
],
[
"How does Oona's easily achieved victory affect the depth of the story's gender commentary?",
"It obscures the genuine difficulty and real-world friction involved in navigating systemic gender dynamics."
],
[
"What societal assumption regarding power metrics does 'The Giant's Wife' directly challenge?",
"The assumption that physical strength is the primary metric of power."
],
[
"What belief regarding gendered intelligence is undermined by Oona's actions in 'The Giant's Wife'?",
"The assumption that a woman's intelligence is secondary to a man's physical strength."
],
[
"What physical injury causes Cuhullin to retreat from Fin MacCool's house?",
"Having his finger bitten off by Fin, who was disguised as a baby in a cradle."
],
[
"How does the tone of the tall tale's resolution affect the perceived complexity of its themes?",
"Its neat and humorous nature makes the thematic victory feel triumphant yet uncomplicated."
],
[
"Which prerequisite module block directly precedes the L5 evaluation chunk of 'The Giant's Wife'?",
"Chunk GW-05-L4."
],
[
"What are the five structural phases that compose Oona's heroic trajectory in 'The Giant's Wife'?",
"Recognise threat, plan, execute, win, and show mercy."
],
[
"In terms of character tools, how does Oona's victory contrast with that of classic male epic heroes?",
"Oona achieves victory completely without weapons, physical combat, or supernatural magic."
],
[
"Why is analytical reading necessary to appreciate the underlying commentary of 'The Giant's Wife'?",
"To ensure the precise thematic argument is registered rather than lost beneath surface comedic entertainment."
],
[
"What potential vulnerability exists in using 'entertainment-as-argument' in folk literature adaptations?",
"Passive audiences may enjoy the humorous performance without ever recognising the underlying social critique."
],
[
"Why does humour prevent thematic reversals from feeling confrontational to traditionalist audiences?",
"Laughter lowers ideological defensiveness, making audiences absorb social reversals naturally."
],
[
"How does showing a story world operating on an argument's terms differ from explicitly asking for audience assent?",
"Showing demonstrates the reality in action, whereas asking for assent requires agreeing with a declared moral position."
],
[
"How does Fin's hiding in a cradle affect audience empathy toward him?",
"It creates comic distance, encouraging viewers to mock his cowardice rather than sympathise with his predicament."
],
[
"Why is the theme of wit versus power considered 'proven, not claimed' in 'The Giant's Wife'?",
"It is validated through three concrete narrative successes rather than stated abstractly in dialogue."
],
[
"What character reaction makes Cuhullin's defeat final and irreversible at the story's climax?",
"Cuhullin fleeing the scene in terror after suffering physical harm from the disguised baby."
],
[
"Why is structural representation of gender equity considered more durable than direct propaganda?",
"It avoids aging poorly or appearing dated, as it relies on narrative dynamics rather than time-bound slogans."
],
[
"How does omitting magical intervention elevate Oona's standing as a literary heroine?",
"It attributes her success entirely to her own cognitive ingenuity, strategy, and self-reliance."
],
[
"Why might a realistic drama communicate the difficulties of female heroism more thoroughly than a tall tale?",
"Realistic drama retains real-world friction and consequences, whereas tall tales resolve conflict easily and neatly."
],
[
"What is the core evaluative dilemma raised regarding Carleton's structural approach in 'The Giant's Wife'?",
"Whether delivering an argument through light entertainment is effective enough if non-analytical viewers miss the point."
],
[
"How does 'The Giant's Wife' invert the standard folktale trope of the heroic giant?",
"By depicting the mighty giant as helpless and reliant on his non-giant wife's intellect for survival."
],
[
"By allowing audiences to infer the gender argument from narrative events, Carleton ensures they _____ the conclusion rather than passively receiving it.",
"own"
],
[
"Why is the tall tale adaptation deemed the 'right choice' for Carleton's target audience?",
"It delivers social commentary seamlessly under the guise of accessible, entertaining folk storytelling."
],
[
"Why have Carleton's thematic arguments maintained their force into the modern era?",
"The social biases prioritising male force over female intellect remain prevalent in contemporary culture."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
