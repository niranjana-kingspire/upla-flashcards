<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Leaf - O. Henry | Flashcards - L5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Last Leaf - O. Henry | Flashcards - L5</h1>
    <p class="subtitle">O. Henry · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"In O. Henry's \"The Last Leaf\", on what central medical premise does the theme of \"will to live\" rest?",
"It rests on the doctor's claim that a patient's desire to live measurably affects their recovery trajectory."
],
[
"How does modern medical science validate the core psychological idea behind the \"will to live\" in \"The Last Leaf\"?",
"Modern medicine recognises that psychosomatic and motivational effects can influence recovery outcomes in severe illness."
],
[
"What historical medical reality makes O. Henry's portrayal of pneumonia scientifically over-simplified?",
"Bacterial pneumonia in 1907 was frequently fatal regardless of attitude, as antibiotics did not yet exist."
],
[
"What literary function does the painted leaf serve regarding Johnsy's recovery process?",
"It acts as a symbolic shorthand that compresses a slow medical process into a single image suited to short-story economy."
],
[
"Why is it ethically problematic to view Johnsy's recovery as literally driven by willpower?",
"It risks unintentionally suggesting that physical illness is a failure of willpower, which is an unfair standard for patients."
],
[
"What is the defensible verdict on evaluating the theme of \"hope\" in \"The Last Leaf\"?",
"It is effective within the story's fictional economy, provided the mechanism is understood as symbolic rather than literal clinical advice."
],
[
"Modern medicine recognises _____ and motivational effects on recovery outcomes, supporting the psychological credibility of \"The Last Leaf\".",
"psychosomatic"
],
[
"In 1907, bacterial pneumonia killed patients reliably because _____ had not yet been discovered.",
"antibiotics"
],
[
"Why does Behrman's sacrifice read as an earned culmination of character rather than a mere plot convenience?",
"It is voluntary, deliberate, and framed with interiority, showing his genuine concern before he acts."
],
[
"What troubling fictional trope is present in Behrman's sacrifice for Johnsy?",
"Sacrificing an older, poorer, less \"important\" character solely to serve a younger protagonist's survival arc."
],
[
"How does O. Henry avoid reducing Behrman's death to a mere plot device for Johnsy's survival?",
"By giving Behrman his own redemptive arc, resolving his 40-year failure with a completed masterpiece."
],
[
"Which theme in \"The Last Leaf\" is evaluated as the strongest in terms of originality and moral complexity?",
"Self-sacrifice (demonstrated through Behrman)."
],
[
"Behrman's completed painted leaf represents the resolution of his own thematic arc from forty years of _____.",
"failure"
],
[
"What is the main criticism of Sue's characterisation in \"The Last Leaf\"?",
"Her characterisation is thin, as she is defined almost entirely by her actions for Johnsy without independent inner life."
],
[
"What structural role does Sue perform in \"The Last Leaf\"?",
"She functions primarily as a structural character whose actions support the narrative and Johnsy's recovery arc."
],
[
"Why did O. Henry allocate more of his characterisation budget to Behrman rather than Sue?",
"Behrman's character arc carries the story's final twist and primary moral complexity."
],
[
"Judged by short-story constraints, why is Sue's limited characterisation considered a reasonable authorial trade-off?",
"The format requires prioritising essential plot function and the central twist over full, novelistic character development."
],
[
"Which theme in \"The Last Leaf\" is evaluated as the weakest due to shallow character depth?",
"Friendship (demonstrated through Sue)."
],
[
"What overarching moral vision emerges from combining the four main themes of \"The Last Leaf\"?",
"Ordinary, failed people are capable of decisive goodness, and hope and care measurably matter to human survival."
],
[
"How does the brevity of \"The Last Leaf\" impact the emotional delivery of its themes?",
"It compresses thematic nuance but maximises the emotional force of the final reveal."
],
[
"At Bloom's Taxonomy Level 5 (Evaluate), what is required beyond identifying story themes?",
"Forming a defensible opinion on how convincingly, ethically, and artistically the themes are handled."
],
[
"What risk is created if \"The Last Leaf\" is read as literal medical advice?",
"It becomes medically irresponsible by over-simplifying a severe, fatal bacterial infection into a matter of attitude."
],
[
"In literary evaluation, Behrman's act of painting the leaf is kept strictly _____ rather than presented as a literal medical cure.",
"symbolic"
],
[
"How does O. Henry show Behrman's interiority before he paints the leaf?",
"He presents Behrman reacting with genuine concern for Johnsy before taking action."
],
[
"What dual purpose does Behrman's masterpiece serve in the narrative structure?",
"It enables Johnsy's physical survival while simultaneously fulfilling Behrman's personal artistic destiny."
],
[
"In evaluating narrative construction, Sue's role is described as strictly _____, supporting Johnsy's arc.",
"structural"
],
[
"Why might expanding \"The Last Leaf\" into a longer novel have weakened its thematic impact?",
"A longer narrative might have provided more nuance but diluted the emotional punch of the final reveal."
],
[
"What descriptive label is given to the overall moral vision of \"The Last Leaf\" in L5 evaluation?",
"Modestly sentimental."
],
[
"What two criteria are used to rank Self-Sacrifice as the strongest theme in \"The Last Leaf\"?",
"Originality and moral complexity."
],
[
"What criterion is used to rank Friendship as the weakest theme in \"The Last Leaf\"?",
"Depth of characterisation."
],
[
"What primary objective defines Bloom's Taxonomy Level 5 (Evaluate) in literary study?",
"Forming defensible judgements supported by reasons rather than simply reacting to a happy ending."
],
[
"Evaluative analysis of \"The Last Leaf\" balances the psychological credibility of hope against the danger of medical _____.",
"over-simplification"
],
[
"Why is Behrman's death considered the most \"morally weighted choice\" in \"The Last Leaf\"?",
"It involves a voluntary, deliberate sacrifice made to give another person the hope needed to survive."
],
[
"How does the compressed timeline of a short story justify symbolic narrative devices like the painted leaf?",
"Short stories require tight economy, using concise symbols to compress complex, gradual real-world processes."
],
[
"What ethical concern arises from portraying physical illness as curable chiefly through attitude?",
"It risks subtly blaming patients for their illness if their physical condition fails to improve."
],
[
"In \"The Last Leaf\", Johnsy's fatalistic expectation of death is countered primarily by which two thematic concepts?",
"Hope and the will to live."
],
[
"How does O. Henry demonstrate that Behrman's sacrifice is not merely a plot convenience?",
"By depicting his genuine emotional concern beforehand and linking the act to his lifelong goal of painting a masterpiece."
],
[
"What narrative trade-off occurs when an author prioritises plot twist mechanics over character depth?",
"Secondary characters (such as Sue) remain functional and thin rather than fully developed."
],
[
"Why is Sue's character defined almost exclusively through her actions on Johnsy's behalf?",
"She lacks independent inner life portrayed on the page due to authorial focus on Behrman's arc."
],
[
"What fundamental truth about human capability does the overall evaluative verdict of \"The Last Leaf\" assert?",
"Ordinary, even failed, people are capable of decisive goodness."
],
[
"In evaluative terms, what prevents O. Henry's depiction of hope from being dismissed as mere sentimentality?",
"Its alignment with real-world psychosomatic effects observed by medical professionals."
],
[
"How does O. Henry's use of a single symbolic image benefit the narrative economy of \"The Last Leaf\"?",
"It distils a lengthy medical recovery into one immediate, dramatic focal point."
],
[
"What specific bacterial infection poses the lethal threat to Johnsy in \"The Last Leaf\"?",
"Pneumonia."
],
[
"Why is Behrman's masterpiece considered redemptive within his personal character arc?",
"It resolves forty years of artistic failure by producing a single, life-saving work of art."
],
[
"What distinction is made between reading the painted leaf symbolically versus reading it literally?",
"Symbolically it represents psychological motivation, whereas literally it incorrectly implies attitude cures infection."
],
[
"What evaluative judgement is passed on O. Henry's decision to limit Sue's character development?",
"It is judged as a reasonable authorial trade-off given short-story constraints."
],
[
"What structural element of \"The Last Leaf\" delivers its emotional impact?",
"The final reveal of Behrman's painted leaf."
],
[
"The theme of self-sacrifice in \"The Last Leaf\" avoids being purely instrumental by giving Behrman his own _____ arc.",
"redemptive"
],
[
"In evaluating \"The Last Leaf\", judging Sue by the standard of a novel's character development is considered _____.",
"inappropriate (or an unfair standard given short-story constraints)"
],
[
"What critical factor does the doctor in \"The Last Leaf\" identify as influencing a patient's physical recovery?",
"The patient's outlook and desire to live."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
