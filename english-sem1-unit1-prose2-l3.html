<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All About a Dog - A.G. Gardiner | Flashcards - L3</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>All About a Dog - A.G. Gardiner | Flashcards - L3</h1>
    <p class="subtitle">A.G. Gardiner · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"What is required during character analysis at Bloom's Taxonomy Level 3 (Apply)?",
"Connecting character traits to specific scenes and producing written analysis using a structured method."
],
[
"What is Step 1 in the four-step character analysis method?",
"Name the character and state their dominant trait clearly in one sentence."
],
[
"What is Step 2 in the four-step character analysis method?",
"Identify a specific moment or quote from the text that shows the character's dominant trait in action."
],
[
"What is Step 3 in the four-step character analysis method?",
"Explain what a specific moment reveals about the character's deeper motivation."
],
[
"What is Step 4 in the four-step character analysis method?",
"Link the character's actions to the author's intent and broader social message."
],
[
"What dominant trait characterises the bus conductor in A.G. Gardiner's essay?",
"Rigid, self-righteous enforcement of rules."
],
[
"How does the conductor respond when a passenger demands his conductor number?",
"He offers it imperturbably, without shame or hesitation."
],
[
"What does the conductor's imperturbable response to passengers reveal about his motivation?",
"It reveals he feels entirely justified because enforcing rules gives him personal power."
],
[
"Which literary concept from H.G. Wells does Gardiner link to the bus conductor?",
"The concept of the 'Resentful Employee'."
],
[
"Why does Gardiner connect the conductor to H.G. Wells's 'Resentful Employee'?",
"To show that rigid, authoritarian behaviour is a broader social pattern rather than an isolated individual flaw."
],
[
"What key turning point marks the sealskin lady's surrender in the essay?",
"Her statement 'I'll go on the top' after previously asserting that doing so would kill her."
],
[
"What does the sealskin lady's ultimate surrender reveal about her character?",
"It demonstrates how determined personal resistance eventually yields to relentless official authority."
],
[
"According to the key takeaway, what must strong character analysis always link together?",
"It must link surface behaviour to deeper motive using specific textual evidence."
],
[
"What does applying the 'letter versus spirit' framework require an analyst to evaluate?",
"Whether strict enforcement of a rule serves or defeats its underlying purpose in a specific context."
],
[
"What is Step 1 in the three-step framework for analysing rules versus common sense?",
"Identify the rule and state its intended purpose."
],
[
"What is Step 2 in the three-step framework for analysing rules versus common sense?",
"Describe the specific context in which the rule is being applied."
],
[
"What is Step 3 in the three-step framework for analysing rules versus common sense?",
"Judge whether strict enforcement serves or defeats the stated purpose of the rule in that context."
],
[
"In the mobile phone rule example, what is the underlying spirit of the rule?",
"To prevent classroom distraction."
],
[
"Why does strictly enforcing a mobile phone ban defeat its spirit when a student checks on a sick relative?",
"Because rigid enforcement harms student welfare, which the school environment aims to protect."
],
[
"How does briefly parking on double yellow lines to let an ambulance pass reflect the spirit of the rule?",
"It upholds road safety and emergency access, which is the underlying purpose of parking restrictions."
],
[
"What was the stated intended purpose of the bus rule against small dogs?",
"To ensure passenger comfort during transit."
],
[
"How does enforcing the no-dog rule against the lady with the small dog violate its original spirit?",
"It causes widespread passenger discomfort and suffering on a freezing cold night."
],
[
"What four elements form the paragraph structure for applying the letter versus spirit distinction in an essay?",
"State the distinction, provide textual evidence, explain how enforcement violates purpose, and connect to a broader context."
],
[
"What example does Gardiner give of a 'hard and fast' rule that must be strictly obeyed?",
"The rule of the road."
],
[
"Why does Gardiner classify the rule of the road as a 'hard and fast' rule?",
"Because violating it directly causes danger to life and limb."
],
[
"What skill is required at Level 3 when analysing Gardiner's essay style?",
"Identifying specific literary devices and explaining their comic effects using a structured method."
],
[
"Which literary device is used in the phrase 'The storm inside rose high'?",
"Irony."
],
[
"What comic effect is achieved by referring to a bus argument as 'The storm inside'?",
"It treats a petty bus quarrel like a dramatic natural catastrophe, mocking the passengers' exaggerated emotions."
],
[
"What standard sequence should be followed when writing an analytical tip for irony?",
"Name the device, quote the text, and explain the comic effect created."
],
[
"Which literary device is present in the clause 'His embittered soul was having a real holiday'?",
"Hyperbole."
],
[
"How does hyperbole create comic distance in the description of the conductor's soul?",
"By exaggerating a minor dispute into a soulful holiday, making the conductor's satisfaction look absurd."
],
[
"Which visual detail is repeated six times throughout Gardiner's essay?",
"The image of the little dog blinking at the lights."
],
[
"What is the structural function of repeating the image of the dog blinking at the lights?",
"It resets the reader's perspective whenever human conflict and emotional tension peak."
],
[
"Which literary device compares the bus conductor to 'a captain on the quarterdeck'?",
"Mock-heroic simile."
],
[
"What generates humour in applying the phrase 'like a captain on the quarterdeck' to the conductor?",
"The wide gap between grand military imagery and a street bus conductor enforcing trivial rules."
],
[
"What four parts comprise the analytical paragraph structure for literary devices in humour?",
"Name the device, provide the quote, explain the comic effect, and connect to the overall theme or tone."
],
[
"Which word signals irony in the description of the passenger who promised to sit all night?",
"The adjective 'dashing'."
],
[
"According to the key takeaway on literary devices, what must analysis include beyond simple identification?",
"An explanation of the comic or emotional effect created and how it serves the essay's purpose."
],
[
"What is the primary objective of thematic writing at Bloom's Level 3?",
"To connect specific textual evidence to broader truths about human behaviour and society."
],
[
"What is Step 1 of a structured thematic paragraph?",
"State the theme and the text in a clear topic sentence."
],
[
"What is Step 2 of a structured thematic paragraph?",
"Provide specific textual evidence, such as a quote or reference to a key moment."
],
[
"What is Step 3 of a structured thematic paragraph?",
"Explain what the selected textual moment demonstrates about the central theme."
],
[
"What is Step 4 of a structured thematic paragraph?",
"Make a wider connection showing how the textual moment reflects general human behaviour."
],
[
"What broader truth about institutional authority does Gardiner explore through the conductor?",
"Authority often becomes a tool for personal emotional gratification rather than public service."
],
[
"According to Gardiner, what does authority descend into when exercised without empathy?",
"It becomes indistinguishable from bullying."
],
[
"Which textual moment serves as primary evidence for analysing the theme of empathy in the essay?",
"The narrator's final speech to the bus conductor."
],
[
"What thematic point does the narrator's final speech demonstrate regarding human conflict?",
"That empathy and reasonable discourse achieve compliance where anger and threats fail."
],
[
"Which textual event provides evidence for Gardiner's critique of social norms and solidarity?",
"The passengers' loud vocal protests followed by their quick departure from the bus."
],
[
"What key gap in social behaviour is highlighted by the passengers' protest and subsequent exit?",
"The gap between what people profess in public solidarity and what they actually do when challenged."
],
[
"What critical error must writers avoid when composing a thematic paragraph?",
"Simply summarizing the plot instead of linking textual events to broader thematic ideas."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
