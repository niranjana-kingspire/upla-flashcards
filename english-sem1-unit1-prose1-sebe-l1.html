<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoken English &amp; Broken English - G.B. Shaw | Flashcards - L1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Spoken English &amp; Broken English - G.B. Shaw | Flashcards - L1</h1>
    <p class="subtitle">G.B. Shaw · 50 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"Which Nobel Prize in Literature winner delivered the 1927 speech 'Spoken English and Broken English'?",
"George Bernard Shaw."
],
[
"George Bernard Shaw was awarded the Nobel Prize in Literature in _____.",
"1925"
],
[
"What medium was originally used to distribute George Bernard Shaw's 1927 speech 'Spoken English and Broken English'?",
"Gramophone records."
],
[
"What were the two target audiences for G.B. Shaw's recorded speech on spoken English?",
"Foreign students of English and native speakers of provincial or Cockney dialects."
],
[
"On which committee did George Bernard Shaw sit to help set British public broadcasting speech standards?",
"The BBC Advisory Committee on Spoken English."
],
[
"Why does G.B. Shaw open his recorded speech with a warning about gramophone speed settings?",
"To prevent audio speed distortion from altering his voice beyond recognition."
],
[
"How does George Bernard Shaw self-deprecatingly describe himself at the start of his recording?",
"An amiable old gentleman of 71 with a pleasant Irish voice."
],
[
"According to George Bernard Shaw, what is the primary goal of language?",
"Successful communication of meaning rather than grammatical or phonetic perfection."
],
[
"Concept: Broken English",
"Definition: English spoken without formal grammar and with a strong foreign accent, used as a practical communication tool."
],
[
"Concept: Perfect English",
"Definition: English spoken with complete grammatical accuracy and native-standard pronunciation."
],
[
"What main claim does Shaw make regarding foreign speakers using broken English in England?",
"Foreigners speaking broken English are understood far better and receive more help than those speaking perfect formal English."
],
[
"Why does a strong foreign accent assist foreign travellers when speaking to native listeners?",
"It signals foreignness immediately, causing native listeners to adjust their patience and attention."
],
[
"Why can speaking perfect formal English cause confusion for native English listeners?",
"Native listeners fail to recognise the speaker as a foreigner and are confused by unfamiliar stress patterns."
],
[
"What elaborate phrase does Shaw cite to illustrate formal sentence failure when asking for directions?",
"'Will you have the goodness, sir, to direct me to the railway terminus at Charing Cross'"
],
[
"How do native listeners react when a foreigner uses overly elaborate, formal phrasing to ask for directions?",
"They experience confusion and potential distrust towards the speaker."
],
[
"What concise phrase does Shaw recommend using when asking for directions to Charing Cross?",
"'Please, Charing Cross, which way?'"
],
[
"What immediate outcome occurs when a foreigner uses direct broken English to ask for directions?",
"Native bystanders immediately step forward to offer assistance."
],
[
"Concept: Correct English",
"Definition: The idealised concept that a single, perfect standard of spoken English exists for all speakers."
],
[
"Concept: Presentable English",
"Definition: Spoken English that is intelligible in any English-speaking country and marks the speaker as educated, without requiring phonetic perfection."
],
[
"What verdict does George Bernard Shaw reach regarding the existence of 'correct English'?",
"Ideal correct English does not exist in practice."
],
[
"Which public language figures served alongside Shaw on the BBC pronunciation committee?",
"The Poet Laureate, a famous actor, and experienced public speakers."
],
[
"What evidence from the BBC committee proves that no single 'correct English' exists?",
"The expert members could not agree on the correct pronunciation of simple words like 'yes' and 'no'."
],
[
"According to Shaw, how extensive is spoken language variation among British subjects?",
"No two British subjects speak English exactly alike."
],
[
"What realistic standard of speech does Shaw advocate in place of unattainable phonetic perfection?",
"Presentable English."
],
[
"Concept: Company Manners in Speech",
"Definition: The careful, clear, and formal register used when addressing strangers, guests, or public audiences."
],
[
"Concept: Home Manners in Speech",
"Definition: The casual, abbreviated, and mumbled register used when speaking with family members or close acquaintances."
],
[
"In which form of human behaviour is audience-based register adjustment most pronounced according to Shaw?",
"Spoken language."
],
[
"How does Shaw's speech when recording for the gramophone compare to his speech at the breakfast table?",
"He speaks with extreme clarity for the gramophone but mumbles casually at the breakfast table."
],
[
"What complaint does Shaw's wife make when he speaks to her with 'home manners' at breakfast?",
"She complains that he mumbles and turns his head away, making his words inaudible."
],
[
"How does Shaw pronounce 'What o'clock is it?' when speaking casually to his wife?",
"'Clock's it'"
],
[
"What hypothetical scenario does Shaw use to illustrate the dramatic shift between home and company speech manners?",
"Overhearing a family through a keyhole and then stepping directly into their room."
],
[
"Why might native listeners view a foreign speaker with suspicion if they speak unnaturally flawless English?",
"They may suspect the speaker of being a beggar or a confidence trickster."
],
[
"What general principle does Shaw express regarding learning and speaking foreign languages while travelling?",
"Travellers should never attempt to speak foreign languages too perfectly."
],
[
"What does casual or mumbled 'home speech' demonstrate about a speaker's educational level?",
"It reflects natural context-based audience adjustment rather than illiteracy or lack of education."
],
[
"Which three main themes structure Shaw's argument in 'Spoken English and Broken English'?",
"Language variation, audience awareness, and communication as the primary goal of speech."
],
[
"How is the theme of language variation illustrated within the BBC Advisory Committee on Spoken English?",
"Through the diverse regional accents of its members, including Irish, Scottish, Welsh, American, and Oxford accents."
],
[
"How does Shaw demonstrate the theme of audience awareness through his own speech habits?",
"By switching between formal clarity for public recordings and relaxed mumbling at home."
],
[
"Which example in the text best illustrates the principle that communication supersedes grammatical perfection?",
"The success of the short phrase 'Please, Charing Cross, which way?' over its formal equivalent."
],
[
"Shaw notes that the founding of the _____ in 1927 brought pronunciation debates into British public life.",
"British Broadcasting Corporation (BBC)"
],
[
"What emotional response do native speakers experience when successfully helping a foreigner using broken English?",
"They feel good about providing assistance to a cooperative foreign visitor."
],
[
"What speech attribute does presentable English eliminate to mark a speaker as socially acceptable?",
"Phonetic marks of uneducated speech or illiteracy."
],
[
"Why does Shaw describe his own voice as having an Irish accent?",
"To acknowledge his regional origin and prove that even prominent public figures retain regional speech traits."
],
[
"What underlying attitude should language learners adopt towards grammatical errors according to Shaw?",
"Learners should prioritise willingness to communicate over fear of making grammatical errors."
],
[
"In 'Spoken English and Broken English', what makes the text's tone distinctly conversational?",
"Its original format as a spoken gramophone recording featuring direct address and personal anecdotes."
],
[
"How does the presence of unfamiliar stress patterns in 'perfect' foreign speech affect British listeners?",
"It obscures meaning by forcing listeners to process unexpected rhythm and stress."
],
[
"According to Shaw, how many times during a meal might he need to ask 'What?' due to his wife's home manners?",
"Two or three times."
],
[
"What requirement does presentable English place on global intelligibility?",
"It must be easily understood across every English-speaking country."
],
[
"What role did the gramophone play in language learning during the 1920s context of Shaw's speech?",
"It served as the primary mass-audio medium for distributing spoken language instruction."
],
[
"What relationship does Shaw establish between audience context and speech precision?",
"Greater distance and formality from the audience require increased speech clarity and care."
],
[
"What key message does Shaw give to timid foreign travellers who hesitate to speak English abroad?",
"They need very little English and can speak quite badly while still successfully getting by."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
