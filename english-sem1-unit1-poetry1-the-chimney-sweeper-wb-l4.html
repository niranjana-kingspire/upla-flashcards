<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chimney Sweeper - William Blake | Flashcards - L4</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Chimney Sweeper - William Blake | Flashcards - L4</h1>
    <p class="subtitle">William Blake · 60 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"How does the symbol of the 'black coffins' relate structurally to the 'Angel' in Blake's analysis?",
"They form a cause-and-effect pair where the coffins represent entrapment and the Angel represent a false resolution."
],
[
"What specific social condition is represented by the concrete image of 'black coffins'?",
"The sweeps being socially and economically buried by poverty and exploitation."
],
[
"In the contrast between the coffins and the Angel, which image represents the 'hard, physical' pole of reality?",
"The black coffins."
],
[
"How does the Angel's role as a symbol differ from the physical reality of the coffins?",
"The Angel is an abstract, spiritual image providing religious consolation rather than a physical reality."
],
[
"To what animal's coat is Tom's white hair compared to signify an unspoiled state?",
"A lamb."
],
[
"What does the accumulation of 'soot' represent regarding the state of the children's innocence?",
"The long-term erosion of innocence caused by economic necessity and labour."
],
[
"In the 'white hair and soot' symbol pair, what action serves as the 'triggering event' for the loss of innocence?",
"The shaving of Tom's hair."
],
[
"Why is the 'white hair-soot' pair considered more pessimistic than the 'coffin-Angel' pair?",
"Because the erosion of innocence is never resolved in the poem, whereas the entrapment gets an imagined fix in a dream."
],
[
"How does the poem's stanza pattern mirror the relationship between the symbol pairs?",
"It follows a sequence of harsh reality, followed by imagined relief, followed by a return to harshness."
],
[
"Where in the poem's structure is the tension of the 'black coffins' resolved?",
"Only inside Tom Dacre's dream."
],
[
"To analyse the dream vision as a social critique, into which two structural components must it be separated?",
"What the dream promises and what actually results when the boys wake."
],
[
"According to the causal chain of the dream, what is the direct behavioural effect of the Angel's promise on the boys?",
"It produces calm, compliant children who go to work 'happy and warm' instead of resistant ones."
],
[
"Through what mechanism does Blake's critique of religious comfort operate?",
"Through showing the consequence of passivity rather than using direct critical statements."
],
[
"What 'gap' must a reader notice to perceive the poem's dream vision as a social critique?",
"The gap between the dream's comforting content and the boys' actual, unchanged material circumstances."
],
[
"How does the narrator's experience of the dream differ from the reader's intended perception?",
"The narrator finds the dream straightforwardly comforting, while the reader is meant to view it with critical irony."
],
[
"Why might a direct critique of the Church have been less effective than Blake's indirect dream structure?",
"It removes the reader's active role in recognising irony and would have increased the risk of censorship."
],
[
"The indirect structure of the dream vision serves rhetorical safety and what other purpose for the reader?",
"A more persuasive experience where the reader must supply the critical judgment themselves."
],
[
"Identify the 'root condition' that initiates the causal chain of the poem's three central themes.",
"Child labour."
],
[
"What specific economic cause necessitated the use of 'small bodies' for chimney sweeping?",
"The need to clean narrow flues."
],
[
"How is 'exploitation' defined as a direct effect of economic pressure in the poem?",
"Employers and society benefit from labour conditions that no adult would accept for themselves."
],
[
"In the thematic analysis, how is 'hope' reclassified relative to exploitation?",
"As a secondary effect or psychological substitute for escape when underlying conditions cannot be changed."
],
[
"How does the 'hope' offered by the Angel differ from 'genuine hope'?",
"Genuine hope is oriented toward achievable change, while the poem's hope is oriented toward acceptance of unchanged conditions."
],
[
"What is the structural function of the 'comforting counter-images' that follow depictions of suffering?",
"They leave the material cause of suffering intact while providing a psychological sedative."
],
[
"Why does the theme of hope contribute to the persistence of child labour in the poem's analysis?",
"It explains why the tension between labour and exploitation persists without triggering rebellion."
],
[
"What is the effect on meaning of placing 'The Chimney Sweeper' in 'Songs of Innocence' rather than 'Songs of Experience'?",
"It creates a disturbing irony through the mismatch of the volume's gentle tone and the poem's harsh subject."
],
[
"How does the critique in the 'Innocence' version of the poem differ from the 'Experience' version?",
"The 'Innocence' version is implicit and embedded in comforting imagery, whereas the 'Experience' version is explicit and angry."
],
[
"What targets does the child in the 'Songs of Experience' version openly denounce?",
"God and his Priest and King."
],
[
"Why does the 'Innocence' version of the poem achieve a 'sharper ironic effect'?",
"Because the criticism is hidden beneath reassurance, requiring more analytical work from the reader."
],
[
"According to the analysis of the two-volume project, how is a speaker's psychological response determined?",
"By how much the speaker has been allowed to see or say regarding social reality."
],
[
"What linguistic limitation distinguishes the 'Innocence' sweep from the 'Experience' sweep?",
"The 'Innocence' sweep does not yet have the vocabulary for the anger expressed by the 'Experience' sweep."
],
[
"In the symbol analysis, what is the 'effect' corresponding to the 'cause' of the sweeps' entrapment?",
"The black coffins."
],
[
"Which symbol pair tracks a 'process' of erosion rather than a 'single moment' of loss?",
"White hair and soot."
],
[
"What does the Angel's promise of 'God as a father' functionally produce in the sweeps?",
"Passivity and compliance."
],
[
"Why is the reader positioned to draw a conclusion that the characters in the poem cannot?",
"To highlight the irony and the deceptive nature of the religious comfort the characters accept."
],
[
"What is the primary motivation for wealthy households employing child sweeps according to the text?",
"The need for cheap, small bodies to navigate flues."
],
[
"The theme of hope acts as a _____ rather than a motivation for change.",
"Sedative"
],
[
"Blake uses _____ to protect himself from the period's restrictions on criticising religious institutions.",
"Indirect critique (or dream-based structure)"
],
[
"The mismatch between the volume's expected gentle content and the poem's actual harsh subject causes _____.",
"Irony"
],
[
"In Tom's dream, the Angel's 'fix' for the sweeps' entrapment is described as _____ because it never changes waking reality.",
"False"
],
[
"The 'white hair-soot' pair is more pessimistic because the poem offers no _____ for lost innocence.",
"Fix (or resolution)"
],
[
"Exploitation is described as the direct effect of _____ pressure.",
"Economic"
],
[
"The 'Innocence' version of the poem embeds its critique within a _____ narrator.",
"Naive"
],
[
"According to the causal chain, _____ is the third theme that emerges as a secondary effect of exploitation.",
"Hope"
],
[
"The 'relief or innocence pole' in the first symbol pair is represented by the _____.",
"Angel"
],
[
"The 'harsh pole' in the second symbol pair is represented by _____.",
"Soot"
],
[
"What is the consequence of the characters being unable to see the 'gap' between the dream and reality?",
"They remain happy and compliant despite their unchanged suffering."
],
[
"How does the 'Experience' sweep's reaction to reality differ from that of the 'Innocence' sweep?",
"The 'Experience' sweep responds with open anger and denunciation rather than quiet acceptance."
],
[
"What role does the reader play in Blake's indirect rhetorical strategy?",
"The reader must supply the critical judgment that the text withholds."
],
[
"Why does the analysis suggest the poem never shows anyone 'actually escaping'?",
"Because the causal chain leads to pacifying hope which maintains the status quo of exploitation."
],
[
"What is the structural purpose of the Angel in the context of the poem's 'tension'?",
"To provide an imagined, temporary relief that does not address the material cause of suffering."
],
[
"Concept: Causal chain of themes",
"Poverty causes child labour, which enables exploitation, which produces a need for pacifying hope."
],
[
"Concept: Rhetorical safety",
"Definition: Using indirect structures like dreams to express dangerous political or religious critiques without facing censorship."
],
[
"How does the 'Experience' poem's tone compare to the 'Innocence' poem's tone regarding child labour?",
"The 'Experience' tone is darker and explicitly accusatory, while the 'Innocence' tone is deceptively gentle and implicit."
],
[
"The shaving of Tom's hair is analysed as a _____ for the accumulation of soot over time.",
"Triggering event"
],
[
"What does Blake show religious comfort produces in children, according to subtopic 4?",
"Passivity and compliance rather than resistance."
],
[
"In the comparison of symbol pairs, which element represents the 'long-term consequence' of labour?",
"Soot."
],
[
"Which state of the dream vision is characterized by the Angel's promise of 'God as a father'?",
"What the dream promises."
],
[
"The 'Innocence' sweep's lack of words for anger is a result of being _____.",
"Unaware of their exploitation (or not yet allowed to see the truth)."
],
[
"What remains 'completely intact' even when the poem introduces comforting counter-images?",
"The material cause of suffering (economic exploitation of child labour)."
],
[
"How does the placement of 'The Chimney Sweeper' in 'Innocence' affect the reader's 'active role'?",
"It demands that the reader recognise the irony and provide the critical judgement themselves."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
