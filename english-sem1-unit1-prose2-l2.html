<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All About a Dog - A.G. Gardiner | Flashcards - L2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>All About a Dog - A.G. Gardiner | Flashcards - L2</h1>
    <p class="subtitle">A.G. Gardiner · 51 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"Who was A.G. Gardiner in the context of British literature?",
"A British journalist, editor, and essayist who lived from 1865 to 1946."
],
[
"Under what pen name did A.G. Gardiner write his familiar essays?",
"Alpha of the Plough."
],
[
"Which major newspaper did A.G. Gardiner edit between 1902 and 1919?",
"The Daily News."
],
[
"How is the literary form of 'All About a Dog' categorized?",
"A personal or familiar essay that is informal, first-person, and reflective."
],
[
"What was Gardiner's central purpose in detailing the bus dispute?",
"To make a broader moral argument about the application of rules and human judgement."
],
[
"What were the defining characteristics of early 20th-century British familiar essays?",
"Accessible language, gentle humour, and a clear moral lesson."
],
[
"For what target audience was 'All About a Dog' originally written?",
"A mass newspaper readership seeking thoughtful yet conversational writing."
],
[
"Why does Gardiner reference H.G. Wells's 'Resentful Employee' in the text?",
"To place the bus conductor within a widely recognised social archetype of his era."
],
[
"How does Gardiner's background in journalism influence the tone of 'All About a Dog'?",
"It creates a sympathetic and observational tone toward ordinary people in bureaucratic disputes."
],
[
"What stylistic signal does the understated ending 'Good night quite amiably' convey?",
"It reflects an ironic, understated journalistic style that avoids heavy-handed lecturing."
],
[
"At an analytical level, what must a plot summary explain beyond basic event sequence?",
"Why events are significant and how they connect to the essay's overarching theme."
],
[
"What is the primary conflict in 'All About a Dog'?",
"A conductor enforcing a strict no-dogs rule against a passenger carrying a harmless Pekinese."
],
[
"What key irony drives the central conflict on the bus?",
"The extreme disproportion between the trivial cause and the chaotic disruption created."
],
[
"How do the bus passengers initially react when the conductor halts the journey?",
"They react with loud anger, threatening reports, demanding refunds, and calling the police."
],
[
"How does Gardiner describe the conductor's internal satisfaction during the standoff?",
"As an embittered soul having a 'real holiday' by exerting power over others."
],
[
"What happens to the passenger anger as the standoff continues in the cold?",
"The protest collapses as individual passengers quietly slip away to avoid personal inconvenience."
],
[
"How does the 'dashing young fellow' behave as the bus dispute lingers?",
"He quietly disappears despite earlier swearing he would remain all night."
],
[
"Why does the essay feature a second conflict after the bus engine breaks down?",
"To show that rigid rule enforcement produces recurring conflict rather than genuine compliance."
],
[
"By what method is the dispute between the narrator and the conductor ultimately resolved?",
"Through a calm, reasonable, one-on-one conversation."
],
[
"What structural lesson does the plot progression of 'All About a Dog' demonstrate?",
"Angry confrontation escalates disputes, whereas patient reason achieves resolution."
],
[
"What underlying motivation drives the conductor's rigid behaviour?",
"A deep-seated social resentment and a desire to assert personal power."
],
[
"How does the conductor treat regulations during the argument?",
"As rigid weapons to assert authority rather than principles to maintain order."
],
[
"What does the conductor's repetition of 'I've got my rules' reveal about his judgement?",
"It shows he has completely surrendered personal reasoning to rigid institutional instruction."
],
[
"Why does the 'Sealskin Lady' eventually agree to go to the top deck of the bus?",
"She yields as a reluctant concession to brute authority rather than an admission of wrongdoing."
],
[
"How does Gardiner characterise crowd psychology through the bus passengers?",
"As loud and indignant in group safety, but timid and self-serving individually."
],
[
"What distinguishes the narrator's intervention from that of the other passengers?",
"He avoids shouting or threats, waiting to engage the conductor with quiet, well-timed reason."
],
[
"What narrative function does the Pekinese dog serve throughout the conflict?",
"It acts as a comic visual contrast whose serene indifference highlights human drama's absurdity."
],
[
"How does Gardiner avoid flat morality in his characterisations?",
"He presents characters as flawed, recognizable human types rather than pure heroes or villains."
],
[
"What is Gardiner's core argument regarding the purpose of rules?",
"Rules are practical tools designed to serve human welfare, not rigid ends in themselves."
],
[
"What was the original practical intention behind the transport rule against dogs?",
"To protect passengers from annoyance, disruption, or health discomfort."
],
[
"Why was the strict enforcement of the rule unjustified in the case of the Pekinese?",
"The dog was small, quiet, and caused zero disruption to any passenger."
],
[
"What negative real-world harm resulted from the conductor's rigid enforcement?",
"A sick passenger was exposed to severe cold and an entire busload was delayed."
],
[
"According to Gardiner, what was the conductor's fundamental moral failure?",
"Enforcing a rule mechanically without exercising human empathy or personal judgement."
],
[
"What key distinction does Gardiner make when referring to 'rules and rules'?",
"He distinguishes between absolute safety rules and flexible rules meant for general guidance."
],
[
"How does Gardiner propose authority figures should properly apply rules?",
"By tempering rules with goodwill, good temper, and consideration for passenger comfort."
],
[
"How should rules be observed according to Gardiner's explicit moral formula?",
"In the spirit rather than the letter, ensuring they cause comfort rather than discomfort."
],
[
"How is structural irony generated in 'All About a Dog'?",
"Through the huge disproportion between a minor cause and a massive public transport disruption."
],
[
"How does Gardiner use hyperbole to create character comedy around the conductor?",
"By framing the conductor's petty exercise of power as a 'real holiday' in his 'embittered soul'."
],
[
"Why is referring to the timid passenger as a 'dashing young fellow' an example of irony?",
"The word 'dashing' mockingly contrasts with his quick and quiet retreat from the dispute."
],
[
"How does the recurring image of the blinking dog affect the essay's comic pacing?",
"It periodically deflates high dramatic tension by reminding readers of the situation's triviality."
],
[
"How many times does the Pekinese dog reappear in the narrative to puncture dramatic tension?",
"Six times."
],
[
"The literary technique of describing a trivial matter in grand, heroic terms is known as a _____.",
"mock-heroic style"
],
[
"What effect is achieved by comparing the bus conductor to 'a captain on the quarterdeck'?",
"It uses mock-heroic exaggeration to make the conductor's self-importance appear ridiculous."
],
[
"Why does Gardiner choose a humorous essay style to deliver his moral lesson?",
"To entertain readers and make his critique of authority easier to accept without feeling lectured."
],
[
"What tone defines Gardiner's treatment of human flaws and weaknesses?",
"An affectionate, gentle observational humour rather than harsh or angry condemnation."
],
[
"How does the essay demonstrate the negative aspect of institutional authority?",
"By showing how authority becomes destructive when used for personal ego rather than public service."
],
[
"Why does the narrator's empathetic dialogue succeed in convincing the conductor?",
"He validates the need for rules before pointing out the benefits of applying them flexibly."
],
[
"How is the theme of empathy exemplified through the narrator's conduct?",
"He treats the stubborn conductor as a reasonable human capable of reflection rather than an enemy."
],
[
"What gap in human behaviour does the passengers' exit demonstrate regarding social norms?",
"The gap between vocal commitment to social justice and the private urge toward self-interest."
],
[
"How does Gardiner view the passengers' failure to maintain collective solidarity?",
"With wry, realistic understanding rather than harsh moral condemnation."
],
[
"What ultimate lesson does the essay convey regarding authority stripped of common sense?",
"That authority without empathy damages public trust and causes unnecessary harm."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
