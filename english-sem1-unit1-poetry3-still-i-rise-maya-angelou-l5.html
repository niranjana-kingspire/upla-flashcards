<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still I Rise - Maya Angelou | Flashcards - L5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Still I Rise - Maya Angelou | Flashcards - L5</h1>
    <p class="subtitle">Maya Angelou · 25 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"According to the evaluative analysis of 'Still I Rise', what is the potential risk of using playful imagery like 'sassiness' alongside 'nights of terror'?",
"It may create a tonal inconsistency that risks trivialising serious racial trauma."
],
[
"In 'Still I Rise', how does the playful confidence of the early stanzas affect the poem's final shift into solemn ancestral acknowledgement?",
"It provides credibility that allows the later solemnity to land with greater weight."
],
[
"What is the 'stronger position' regarding the contrast between Angelou's boastful tone and the history of suffering in her poem?",
"The contrast is a deliberate structural choice rather than a careless lapse in tone."
],
[
"How does grounding 'Still I Rise' in the specific history of slavery affect its legitimacy compared to a generic message of empowerment?",
"Naming the true historical referent provides the empowerment message with authenticity and meaning."
],
[
"Why might a general message of empowerment be considered a weakness in the context of Angelou's 'Still I Rise'?",
"It would risk erasing the specific history of slavery and its aftermath that the poem is actually about."
],
[
"What specific phrase from the end of 'Still I Rise' anchors the poem's empowerment message in a historical context?",
"I am the dream and the hope of the slave."
],
[
"According to the L5 evaluation, how do readers from different backgrounds typically relate to the specific racial history in 'Still I Rise'?",
"They can find personal resonance in the defiance without the poem erasing its specific historical roots."
],
[
"In a rhetorical comparison of Blake, Ramanujan, and Angelou, what is the primary strength of Angelouâ€™s directly confrontational stance?",
"It explicitly asserts agency and provides an aspirational model for readers facing oppression."
],
[
"Which real-world application is cited as evidence for the persuasive power and effectiveness of 'Still I Rise'?",
"Its use as the centrepiece of an advertising campaign for the United Negro College Fund."
],
[
"What is the primary rhetorical function of the irony used in William Blake's poetry?",
"It forces the reader to actively supply the moral judgement that the child narrator cannot."
],
[
"Why is the insight generated by Blake's indirect approach often considered more 'durable' than direct instruction?",
"Self-generated insight from interpretive work tends to be more lasting than being told a conclusion directly."
],
[
"In the comparison of the three poems, what is the rhetorical purpose of A.K. Ramanujanâ€™s 'ambivalence' in 'Ecology'?",
"It honestly reflects unresolved family and ecological dilemmas without flattening them into a tidy victory."
],
[
"Why is ranking the poems by Blake, Ramanujan, and Angelou on a single scale of 'effectiveness' considered a mistake?",
"Each poem is suited to a different rhetorical purpose and succeeds by its own standard."
],
[
"Which poem is identified as being best suited for 'direct empowerment and political mobilisation'?",
"Still I Rise by Maya Angelou."
],
[
"Which poem is identified as being best suited for 'cultivating critical and moral reflection'?",
"The Chimney Sweeper by William Blake."
],
[
"Which poem is identified as being best suited for 'honestly representing lived ambivalence'?",
"Ecology by A.K. Ramanujan."
],
[
"Why is a 'tidy resolution' considered a weakness for a poem like Ramanujan's 'Ecology'?",
"It would falsify the actual experience of unresolved trade-offs being described."
],
[
"How do the typical educational uses of Blake's and Angelou's poems differ, according to the text?",
"Blake is used to teach critical reading of injustice, while Angelou is used for fundraising and advocacy."
],
[
"The use of 'oil wells pumping' as a metaphor for confidence is an example of what the text calls _____ imagery.",
"playful"
],
[
"According to the evaluative text, what would be lost if 'I am the dream and the hope of the slave' were replaced with 'I am the dream of everyone who ever struggled'?",
"Specific meaning and historical legitimacy."
],
[
"What rhetorical feature of 'Still I Rise' makes it particularly useful for advocacy and public campaigns?",
"A clear, confident, and quotable voice."
],
[
"How does Blake's 'The Chimney Sweeper' produce a deeper conviction in the reader regarding social injustice?",
"By requiring the reader to perform the interpretive work of supplying moral condemnation."
],
[
"In evaluating theme, what is the 'Position For' the idea that naming one specific history limits a poem's reach?",
"A general message of empowerment would resonate more broadly with different readers."
],
[
"In evaluating tone, what is the 'Position For' the idea that playful imagery trivialises trauma?",
"Mixing boastful confidence with real suffering feels tonally inconsistent."
],
[
"The evaluation of 'Still I Rise' suggests that the shift to ancestral history is more impactful because it follows _____.",
"lighter material"
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
