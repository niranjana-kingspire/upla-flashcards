<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecology - A.K. Ramanujan | Flashcards - L1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Ecology - A.K. Ramanujan | Flashcards - L1</h1>
    <p class="subtitle">A.K. Ramanujan · 40 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"Who is the author of the poem \"Ecology\"?",
"A. K. Ramanujan"
],
[
"What is A. K. Ramanujan's full name?",
"Attipate Krishnaswami Ramanujan"
],
[
"In which Indian city was A. K. Ramanujan born?",
"Mysore"
],
[
"At which American university did A. K. Ramanujan teach?",
"University of Chicago"
],
[
"Apart from being a poet, name two other professional roles held by Ramanujan.",
"Linguist and folklorist"
],
[
"In which two languages did A. K. Ramanujan primarily write?",
"English and Kannada"
],
[
"What is the name of the 1986 poetry collection that includes \"Ecology\"?",
"Second Sight"
],
[
"The poem \"Ecology\" is written in _____, meaning it lacks a fixed rhyme scheme.",
"free verse"
],
[
"How many stanzas comprise the poem \"Ecology\"?",
"Seven"
],
[
"What event triggers the poet's \"rage\" every year in the first stanza?",
"The first rain of the season"
],
[
"How many Red Champak trees are mentioned in the poem?",
"Three"
],
[
"What specific physical ailment do the Champak trees cause the mother?",
"Migraines"
],
[
"According to stanza 3, what substance from the flowers could no wind blow away?",
"Yellow pollen fog"
],
[
"How is the old house personified in stanza 4?",
"It is described as having \"ears and eyes.\""
],
[
"What do the house's \"ears and eyes\" absorb from the environment?",
"Sounds and smells"
],
[
"To what does the poet compare his mother's flashing temper in stanza 5?",
"Her mother's twisted silver"
],
[
"What remedy does the mother use for her migraine in stanza 5?",
"A cold pack on her head"
],
[
"How did the Champak trees originate, according to the mother?",
"From a bird's dropped seed"
],
[
"What term does the mother use to describe the bird's droppings that grew the tree?",
"Providential droppings"
],
[
"According to the mother, how old is the Champak tree?",
"Almost as old as she is"
],
[
"For what religious purpose are the Champak flowers used?",
"Offerings for the gods"
],
[
"To whom in the family are the Champak flowers given?",
"The women (daughters and granddaughters)"
],
[
"The closing line describes the seasonal migraines as a \"_____.\"",
"dower"
],
[
"What does the title \"Ecology\" represent in the context of the poem?",
"The relationship between the family and the natural world"
],
[
"The phrase \"yellow pollen fog of a fragrance\" combines which two senses?",
"Sight and smell"
],
[
"Which sense is primarily targeted by the phrase \"no wind could sift\"?",
"Touch or movement"
],
[
"What type of figurative language is used in the phrase \"flashing her temper like her mother's twisted silver\"?",
"Simile"
],
[
"In the theme of Family Memory, how is the tree connected to the mother's life?",
"It is tied to her life story and passed down through the family's women."
],
[
"Describe the conflict at the heart of the \"Nature vs. human conflict\" theme in the poem.",
"The trees are valued and beautiful but cause physical suffering to the mother."
],
[
"The theme of _____ shows nature as an integrated part of everyday family life.",
"Ecology"
],
[
"What does the word \"dower\" suggest about the migraines in the final line?",
"They are a form of inheritance passed down through the family."
],
[
"Which specific sense is engaged by the mother's \"cold pack\"?",
"Touch"
],
[
"Why does the mother refuse to cut the tree down despite her pain?",
"She values its religious use and its connection to her own past."
],
[
"What visual image in the poem suggests that the house is a living participant in the scene?",
"The description of walls with \"ears and eyes\""
],
[
"Term: Free Verse",
"Definition: Poetry that does not use a consistent meter or rhyme scheme."
],
[
"In the poem, what time of year causes the mother's \"first blinding migraine\"?",
"When the Champak trees burst into flower"
],
[
"What color are the Champak trees mentioned in the poem?",
"Red"
],
[
"Why does the poet return home \"in a rage\" every year?",
"Because he knows the blooming trees will make his mother suffer."
],
[
"The mother's insistence on keeping the tree despite her migraines highlights her deep _____ attachment.",
"cultural"
],
[
"The phrase \"yellow pollen fog\" uses the word \"fog\" as a visual comparison for what?",
"The density and pervasiveness of the flower's fragrance"
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.textContent = pair[0];
    aText.textContent = pair[1];
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
