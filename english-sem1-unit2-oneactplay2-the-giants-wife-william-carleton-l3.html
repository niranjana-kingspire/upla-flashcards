<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Giant&#x27;s Wife - William Carleton | Flashcards - L3</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f3ee;
    color: #1a2332;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 2rem;
  }
  .app { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 1.75rem; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    font-size: 1.45rem;
    line-height: 1.3;
    color: #1a2332;
    margin: 0 0 0.4rem;
  }
  .subtitle { font-size: 0.9rem; color: #6b7280; margin: 0; }

  .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4ddd2;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #2d5a7b;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.85rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scene { perspective: 1200px; width: 100%; max-width: 560px; height: 320px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    outline: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-anim, .card.no-anim .face { transition: none !important; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px rgba(45,90,123,0.35), 0 2px 20px rgba(26,35,50,0.08); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(26,35,50,0.08);
    padding: 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: #ffffff;
    border: 1px solid #d6cfc4;
    transform: rotateY(0deg);
  }
  .back {
    background: #2d5a7b;
    color: #f0f6fa;
    transform: rotateY(180deg);
    visibility: hidden;
    transition: visibility 0s 0.25s;
  }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; transition: visibility 0s 0.25s; }

  .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8275;
    flex-shrink: 0;
  }
  .back .label { color: rgba(240,246,250,0.65); }
  .text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin: auto 0;
    padding: 1rem 0;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 0.8rem;
    color: #8a8275;
    text-align: center;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  button:focus-visible { outline: 3px solid rgba(45,90,123,0.35); outline-offset: 2px; }
  .nav-btn {
    background: #2d5a7b;
    color: #ffffff;
    border: 1px solid #2d5a7b;
    min-width: 6.5rem;
  }
  .nav-btn:hover:not(:disabled) { background: #244a66; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shuffle-btn {
    background: transparent;
    color: #2d5a7b;
    border: 1.5px dashed #2d5a7b;
  }
  .shuffle-btn:hover { background: rgba(45,90,123,0.06); }

  .kbd-hint {
    text-align: center;
    font-size: 0.8rem;
    color: #8a8275;
    margin-top: 1.25rem;
  }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    background: #ffffff;
    border: 1px solid #d6cfc4;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.75rem 0.85rem 1.5rem; }
    h1 { font-size: 1.25rem; }
    .scene { height: 290px; }
    .face { padding: 1.5rem 1.25rem; }
    .text { font-size: 1rem; }
    .kbd-hint { display: none; }
    .nav-btn { min-width: 5.5rem; padding: 0.65rem 1rem; }
    .shuffle-btn { padding: 0.65rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>The Giant&#x27;s Wife - William Carleton | Flashcards - L3</h1>
    <p class="subtitle">William Carleton · 52 Flashcards</p>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">1 / 1</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard. Activate to flip.">
      <div class="face front">
        <div class="label">Question</div>
        <div class="text" id="qText"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Prev</button>
    <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    <button class="nav-btn" id="nextBtn" type="button">Next &rarr;</button>
  </div>

  <div class="kbd-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> to flip</div>
</main>

<script>
const DATA = [
[
"In Bloom's Taxonomy, which level is defined by key verbs such as 'Define', 'List', 'Recall', and 'Name'?",
"L1 Remember"
],
[
"In Bloom's Taxonomy, which level is defined by key verbs such as 'Explain', 'Describe', and 'Summarise'?",
"L2 Understand"
],
[
"In Bloom's Taxonomy, which level is defined by key verbs such as 'Apply', 'Demonstrate', and 'Write'?",
"L3 Apply"
],
[
"In Bloom's Taxonomy, which level is defined by key verbs such as 'Analyse', 'Compare', and 'Examine'?",
"L4 Analyse"
],
[
"In Bloom's Taxonomy, which level is defined by key verbs such as 'Evaluate', 'Critique', and 'Justify'?",
"L5 Evaluate"
],
[
"How does Reader's Theatre fundamentally alter a student's engagement compared to silent reading?",
"It transforms individual passive reception into a shared, vocal, and performative experience."
],
[
"In Reader's Theatre, how is dramatic irony made more perceptible to students?",
"Students actively hear whispered secrets or cues alongside the characters in the performance space."
],
[
"In 'The Giant's Wife', what vocal contrast in Reader's Theatre highlights the personalities of Oona and Fin?",
"The contrast between Oona's calm vocal delivery and Fin's panicked vocal delivery."
],
[
"How does Oona immediately reverse the power dynamic when Cuhullin arrives at the door?",
"She tells him that Fin is out looking for him in a rage, turning the hunter into the hunted."
],
[
"What tactic does Oona use when offering hospitality ('Come in and take your rest') to Cuhullin?",
"She detains him inside the house long enough for her psychological strategy to take effect."
],
[
"How does framing tasks like turning the house as routine for Fin serve Oona's strategy?",
"It systematically constructs a myth of Fin's superior strength to intimidate Cuhullin."
],
[
"What is the psychological purpose of the bread conversation between Oona and Cuhullin?",
"It establishes that even Fin's infant son possesses physical strength superior to Cuhullin."
],
[
"Which specific lies does Oona tell Cuhullin regarding Fin?",
"She lies exclusively about Fin's physical size and his proximity, rather than his existence."
],
[
"According to the L3 analytical framework, what is step 1 of analyzing a character quality?",
"Name the specific character quality being analysed."
],
[
"According to the L3 analytical framework, what is step 2 of analyzing a character quality?",
"Identify the specific textual moment or action associated with the character."
],
[
"According to the L3 analytical framework, what is step 3 of analyzing a character quality?",
"Explain what the chosen moment reveals about the character's traits."
],
[
"According to the L3 analytical framework, what is step 4 of analyzing a character quality?",
"Connect the specific character observation to the broader overarching theme of the story."
],
[
"What evidence prior to Cuhullin's arrival proves Oona's strategic intelligence?",
"She accurately predicts that Cuhullin's forefinger will betray him before he ever appears."
],
[
"Besides material ingenuity, what crucial trait is included in Oona's resourcefulness?",
"Maintaining absolute emotional composure when facing daunting challenges."
],
[
"How does Oona redefine the concept of heroism in 'The Giant's Wife'?",
"She achieves victory through strategic intellect without possessing magical power or giant strength."
],
[
"In conventional folktale structures, what role does the hero typically play compared to the helper?",
"The hero directly defeats the monster, whereas the helper merely assists."
],
[
"How are conventional folktale roles inverted in the cradle scene of 'The Giant's Wife'?",
"The male hero acts as a helpless baby while his wife strategically manages the confrontation."
],
[
"What line demonstrates Fin's initial resistance to Oona's strategy in the cradle scene?",
"What?! Me put on the clothes of a woman?!'"
],
[
"What does Fin's eventual compliance with Oona's plan signify within their domestic space?",
"It signals that Oona holds complete authority and strategic leadership over Fin."
],
[
"According to the text, what is step 1 when identifying tall tale features in a narrative?",
"Describe the specific event taking place in the text."
],
[
"According to the text, what is step 2 when identifying tall tale features in a narrative?",
"Identify the exact nature of the exaggeration used in the event."
],
[
"According to the text, what is step 3 when identifying tall tale features in a narrative?",
"Explain the resulting comic or cultural effect produced by the exaggeration."
],
[
"What exaggerated quantities make up Oona's welcome meal for Fin's return?",
"Three whole roast oxen, thirty boiled cabbages, and a pile of bread loaves."
],
[
"What cultural value does the exaggerated welcome meal reflect in Irish folk tradition?",
"It reflects traditional Irish hospitality extended to mythological proportions."
],
[
"What object serves as Fin MacCool's walking stick in the tall tale?",
"A full-grown fir tree pulled up by its roots and stripped of branches."
],
[
"What comic effect is generated by Fin's use of a stripped fir tree as a walking stick?",
"It comically normalises giant proportions by treating a monumental tree as a simple twig."
],
[
"Why does extreme exaggeration in a tall tale prevent the audience from feeling genuine fear?",
"It creates comic distance by establishing a world governed by absurd, impossible rules."
],
[
"Which script feature in Reader's Theatre assists students with correct performance of key names?",
"A pronunciation guide included in the text."
],
[
"What staging instruction is specifically provided in the script for the climax of the trick?",
"A staging direction for finger faking."
],
[
"According to the text, what basic 4-step structure forms a complete thematic paragraph?",
"State theme and text, give textual evidence, explain its thematic meaning, and connect to broader truth."
],
[
"What key distinction does Carleton make between physical strength and intelligence?",
"Physical strength is external and removable, whereas intelligence is internal and permanent."
],
[
"What specific flaw in Cuhullin does Oona exploit during the finger trap scene?",
"His curiosity regarding the infant's powerful teeth."
],
[
"How is Cuhullin's magical source of power ultimately removed?",
"He voluntarily places his forefinger in the baby's mouth, and Fin bites it off."
],
[
"Which line spoken by Oona demonstrates her mercy after Cuhullin's defeat?",
"Don't be too hard on the poor thing!'"
],
[
"In character analysis, what separates a superficial summary from an analytical insight?",
"Connecting a specific character action directly to a broader thematic argument."
],
[
"In Reader's Theatre, characters' vocal expressions turn silent comprehension into active _____.",
"performance"
],
[
"Oona uses misdirection and false evidence to build Fin's mythic _____.",
"superiority"
],
[
"Unlike physical strength, Oona's strategic superiority relies on foresight rather than _____ cleverness.",
"reactive"
],
[
"In a tall tale, the exaggeration creates _____ distance, ensuring the audience is never frightened.",
"comic"
],
[
"Cuhullin's physical feats include turning an entire house and splitting a _____ with his bare hands.",
"mountain"
],
[
"Concept: Reader's Theatre",
"Definition: An educational script format where students read assigned roles aloud with expression without full staging."
],
[
"Concept: Dramatic Irony in Performance",
"Definition: A theatrical dynamic where the audience or class hears secret information that characters on stage miss."
],
[
"Concept: Psychological Misdirection",
"Definition: A strategy of altering an opponent's perception of power through altered context and social pressure."
],
[
"Concept: Role Reversal",
"Definition: The deliberate inversion of conventional character expectations or traditional gender roles within a story."
],
[
"Concept: Tall Tale Exaggeration",
"Definition: The use of hyperbole in folktales to inflate ordinary domestic or natural elements to mythic proportions."
],
[
"What sequence of actions leads to Cuhullin losing his power in the finger trap?",
"Cuhullin marvels at the baby, Oona invites him to feel its teeth, he inserts his finger, and Fin bites it off."
],
[
"What structural role does the finger trap play in the central argument of 'The Giant's Wife'?",
"It serves as the story's thematic climax, proving that wit overcomes brute power."
]
];

(function () {
  let order = DATA.map((_, i) => i);
  let idx = 0;

  const card = document.getElementById('card');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const faces = card.querySelectorAll('.face');

  function fmt(s) {
    // Escape HTML, then show *text* as italics
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  }

  function render() {
    // Reset to the question side instantly so the next answer is never revealed mid-flip
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    const pair = DATA[order[idx]];
    qText.innerHTML = fmt(pair[0]);
    aText.innerHTML = fmt(pair[1]);
    faces.forEach(f => { f.scrollTop = 0; });
    void card.offsetWidth;
    card.classList.remove('no-anim');

    const total = DATA.length;
    label.textContent = (idx + 1) + ' / ' + total;
    fill.style.width = ((idx + 1) / total * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
  }

  function flip() { card.classList.toggle('flipped'); }
  function prev() { if (idx > 0) { idx--; render(); } }
  function next() { if (idx < DATA.length - 1) { idx++; render(); } }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    idx = 0;
    render();
  }

  card.addEventListener('click', flip);
  prevBtn.addEventListener('click', function () { prev(); this.blur(); });
  nextBtn.addEventListener('click', function () { next(); this.blur(); });
  shuffleBtn.addEventListener('click', function () { shuffle(); this.blur(); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flip(); }
  });

  render();
})();
</script>
</body>
</html>
